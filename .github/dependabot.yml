version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /middleware
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      middleware-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /client-app
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /chaincode
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /middleware
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /middleware
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /client-app
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /chaincode
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /network
    schedule: { interval: weekly }
