name: Feature / API Endpoint Heavy Tests

on:
  push:
    branches:
      - feature/api-endpoints-Testing

  pull_request:
    branches:
      - feature/api-endpoints-Testing

  workflow_dispatch:
    inputs:
      promote:
        description: "Promote to Staging-and-Testing after all tests pass"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact revision to validate
        required: false
        type: string
    secrets:
      PROMOTION_TOKEN:
        required: false
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: feature-api-tests-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  CI: "true"
  DOCKER_BUILDKIT: "1"


defaults:
  run:
    shell: bash

jobs:
  heavy-tests:
    name: Heavy Integration, Container & Route Tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sectioning_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sectioning_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    outputs:
      tested_sha: ${{ steps.resolve-sha.outputs.sha }}

    steps:
      - name: Checkout triggering revision
        if: inputs.checkout_ref != '' || github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Feature/API branch for manual/scheduled run
        if: inputs.checkout_ref == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/checkout@v7
        with:
          ref: feature/api-endpoints-Testing
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact tested commit
        id: resolve-sha
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Testing exact commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify required application structure
        run: |
          set -euo pipefail

          FAILED=0

          require_dir() {
            if [ ! -d "$1" ]; then
              echo "::error::Required directory missing: $1"
              FAILED=1
            else
              echo "FOUND directory: $1"
            fi
          }

          require_file() {
            if [ ! -f "$1" ]; then
              echo "::error::Required file missing: $1"
              FAILED=1
            else
              echo "FOUND file: $1"
            fi
          }

          require_dir frontend
          require_dir middleware
          require_dir chaincode
          require_dir client-app

          require_file frontend/package.json
          require_file frontend/package-lock.json
          require_file frontend/Dockerfile

          require_file middleware/package.json
          require_file middleware/package-lock.json
          require_file middleware/Dockerfile

          require_file chaincode/go.mod
          require_file chaincode/go.sum

          require_file client-app/Dockerfile

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Repository preflight failed."
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            middleware/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: chaincode/go.mod
          cache-dependency-path: chaincode/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false

      - name: Frontend lint
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run lint --if-present

      - name: Frontend tests
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test --if-present

      - name: Build frontend production bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Frontend production dependency audit
        working-directory: frontend
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Install middleware dependencies
        working-directory: middleware
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false

      - name: Middleware lint
        working-directory: middleware
        run: |
          set -euo pipefail
          npm run lint --if-present

      - name: Run middleware base tests when configured
        working-directory: middleware
        run: |
          set -euo pipefail

          TEST_SCRIPT="$(node -e "const p=require('./package.json'); process.stdout.write((p.scripts && p.scripts.test) || '')")"

          if [ -z "$TEST_SCRIPT" ]; then
            echo "::warning::middleware/package.json has no test script; skipping base middleware tests."
            exit 0
          fi

          if [[ "$TEST_SCRIPT" == *"Error: no test specified"* ]]; then
            echo "::warning::middleware test script is still the npm placeholder; skipping it until real tests are added."
            exit 0
          fi

          npm test

      - name: Run middleware API / integration / E2E suites when present
        working-directory: middleware
        run: |
          set -euo pipefail

          has_script() {
            SCRIPT_NAME="$1" node -e '
              const p = require("./package.json");
              process.exit(p.scripts && p.scripts[process.env.SCRIPT_NAME] ? 0 : 1);
            '
          }

          FOUND=0

          for SCRIPT in test:api test:integration test:e2e; do
            if has_script "$SCRIPT"; then
              echo "Running middleware script: $SCRIPT"
              npm run "$SCRIPT"
              FOUND=1
            else
              echo "Not configured: $SCRIPT"
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::No dedicated middleware API/integration/E2E npm script is configured yet."
          fi

      - name: Middleware production dependency audit
        working-directory: middleware
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Verify Go modules
        working-directory: chaincode
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Vet chaincode
        working-directory: chaincode
        run: |
          set -euo pipefail
          go vet ./...

      - name: Run chaincode unit and race tests
        working-directory: chaincode
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

      - name: Build ASP.NET services
        run: |
          set -euo pipefail
          dotnet restore client-app/For_Testing_Only_Capstone.csproj
          dotnet build client-app/For_Testing_Only_Capstone.csproj \
            --configuration Release \
            --no-restore \
            --verbosity minimal

      - name: Run all repository .NET checks
        env:
          SECTIONING_TEST_CONNECTION: Host=localhost;Port=5432;Database=sectioning_tests;Username=postgres;Password=ci-only-postgres-password
        run: |
          set -euo pipefail

          for PROJECT in \
            tests/EnrollmentImportChecks/EnrollmentImportChecks.csproj \
            tests/EnrollmentSectioningChecks/EnrollmentSectioningChecks.csproj
          do
            if [ ! -f "$PROJECT" ]; then
              echo "::error::Required check project is missing: $PROJECT"
              exit 1
            fi

            dotnet run \
              --project "$PROJECT" \
              --configuration Release
          done

      - name: Audit NuGet dependencies
        run: |
          set -euo pipefail
          dotnet list client-app/For_Testing_Only_Capstone.csproj package \
            --vulnerable \
            --include-transitive \
            > dotnet-vulnerabilities.txt
          cat dotnet-vulnerabilities.txt
          if grep -Eq '(^|[[:space:]])(High|Critical)([[:space:]]|$)' dotnet-vulnerabilities.txt; then
            echo "::error::NuGet reported high or critical dependencies."
            exit 1
          fi

      - name: Test client-app if it is a Node project
        run: |
          set -euo pipefail

          if [ ! -f client-app/package.json ]; then
            echo "client-app is not a Node package; skipping Node tests."
            exit 0
          fi

          cd client-app

          if [ -f package-lock.json ]; then
            npm ci --no-audit --fund=false
          else
            npm install --no-audit --fund=false
          fi

          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

      - name: Build current application images
        run: |
          set -euo pipefail

          docker build --pull \
            --tag blockgo/frontend:ci \
            --file frontend/Dockerfile \
            frontend

          docker build --pull \
            --tag blockgo/middleware:ci \
            --file middleware/Dockerfile \
            middleware

          docker build --pull \
            --tag blockgo/client-app:ci \
            --file client-app/Dockerfile \
            client-app

          docker build --pull \
            --tag blockgo/chaincode:ci \
            --file chaincode/Dockerfile \
            chaincode

      - name: Verify built images
        run: |
          set -euo pipefail

          for IMAGE in \
            blockgo/frontend:ci \
            blockgo/middleware:ci \
            blockgo/client-app:ci \
            blockgo/chaincode:ci
          do
            docker image inspect "$IMAGE" >/dev/null
            echo "PASS: $IMAGE"
          done

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: blockgo/frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan middleware image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: blockgo/middleware:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan ASP.NET image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: blockgo/client-app:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan chaincode image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: blockgo/chaincode:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate application image SBOMs
        run: |
          set -euo pipefail
          mkdir -p security-results/sbom

          for IMAGE in frontend middleware client-app chaincode; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$PWD/security-results/sbom:/reports" \
              aquasec/trivy:0.74.0 \
              image \
              --format cyclonedx \
              --output "/reports/${IMAGE}.cdx.json" \
              "blockgo/${IMAGE}:ci"
          done

      - name: Upload image SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blockgo-image-sboms-${{ steps.resolve-sha.outputs.sha }}
          path: security-results/sbom/
          if-no-files-found: warn
          retention-days: 30

      - name: Start frontend production-like container
        run: |
          set -euo pipefail
          docker rm --force blockgo-route-test 2>/dev/null || true
          docker run \
            --detach \
            --name blockgo-route-test \
            --publish 8080:80 \
            blockgo/frontend:ci

      - name: Wait for frontend container readiness
        run: |
          set -euo pipefail

          READY=0

          for ATTEMPT in $(seq 1 45); do
            STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/login || true)"
            echo "Attempt $ATTEMPT/45 -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Frontend container did not become ready."
            docker logs blockgo-route-test || true
            exit 1
          fi

      - name: Verify SPA deep routes
        run: |
          set -euo pipefail

          ROUTES=(
            login
            registrar
            department-admin
            faculty
            student
            system-admin
          )

          FAILED=0

          for ROUTE in "${ROUTES[@]}"; do
            RESPONSE_FILE="/tmp/blockgo-${ROUTE}.html"
            STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' "http://127.0.0.1:8080/${ROUTE}")"

            if [ "$STATUS" != "200" ]; then
              echo "::error::/${ROUTE} returned HTTP ${STATUS}"
              FAILED=1
              continue
            fi

            if ! grep -Eq "<div[^>]*id=[\"']root[\"'][^>]*>" "$RESPONSE_FILE"; then
              echo "::error::/${ROUTE} does not contain the React root element."
              FAILED=1
              continue
            fi

            echo "PASS: /${ROUTE} -> HTTP ${STATUS}"
          done

          if [ "$FAILED" -ne 0 ]; then
            docker logs blockgo-route-test || true
            exit 1
          fi

      - name: Inspect frontend security headers
        run: |
          set -euo pipefail

          HEADERS="/tmp/blockgo-headers.txt"
          curl --silent --show-error --dump-header "$HEADERS" --output /dev/null http://127.0.0.1:8080/login

          for HEADER in X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            if grep -qi "^${HEADER}:" "$HEADERS"; then
              echo "FOUND: $HEADER"
            else
              echo "::warning::Recommended HTTP header missing: $HEADER"
            fi
          done

      - name: Stop frontend route-test container
        if: always()
        run: docker rm --force blockgo-route-test 2>/dev/null || true

      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker images || true
          docker system df || true

  static-security:
    name: Static and Supply-Chain Security
    needs:
      - heavy-tests
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      checkout_ref: ${{ needs.heavy-tests.outputs.tested_sha }}

  free-api-security:
    name: Free API Security — Schemathesis / ZAP / Nuclei
    runs-on: ubuntu-latest
    needs:
      - heavy-tests
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.heavy-tests.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare OpenAPI schema for CI security tests
        id: schema
        run: |
          set -euo pipefail
          mkdir -p security security-results

          if [ -f security/openapi-ci.yaml ]; then
            echo "Using repository-managed security/openapi-ci.yaml"
            echo "path=security/openapi-ci.yaml" >> "$GITHUB_OUTPUT"
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::security/openapi-ci.yaml does not exist. Generating a minimal /api/health schema so the free security stack can run."
          echo "::warning::Add a repository-managed OpenAPI schema to expand API security coverage."

          cat > security/openapi-ci.generated.yaml <<'EOF'
          openapi: 3.0.3
          info:
            title: BlockGo CI Security API
            version: 1.0.0
          servers:
            - url: http://127.0.0.1:4000
          paths:
            /api/health:
              get:
                operationId: getHealth
                responses:
                  "200":
                    description: Middleware health response
          EOF

          echo "path=security/openapi-ci.generated.yaml" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"

      - name: Ensure OpenAPI schema targets only the local CI API
        env:
          OPENAPI_PATH: ${{ steps.schema.outputs.path }}
        run: |
          set -euo pipefail

          # ZAP reads server URLs from the OpenAPI document. Refuse to scan a
          # repository-managed schema unless it explicitly points at the isolated
          # middleware container on this GitHub runner.
          if ! grep -Eq 'url:[[:space:]]*["'"'"']?http://127\.0\.0\.1:4000["'"'"']?[[:space:]]*$' "$OPENAPI_PATH"; then
            echo "::error::The CI OpenAPI schema must contain:"
            echo "::error::  server URL: http://127.0.0.1:4000"
            echo "::error::This safety check prevents ZAP from accidentally scanning staging or production."
            exit 1
          fi

          echo "OpenAPI target is restricted to the local CI middleware."

      - name: Prepare ZAP rule policy
        id: zap-rules
        run: |
          set -euo pipefail
          mkdir -p security

          if [ -f security/zap-rules.tsv ]; then
            echo "Using repository-managed security/zap-rules.tsv"
            echo "path=security/zap-rules.tsv" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > security/zap-rules.generated.tsv <<'EOF'
          6	FAIL	(Path Traversal)
          7	FAIL	(Remote File Inclusion)
          40018	FAIL	(SQL Injection)
          40019	FAIL	(SQL Injection MySQL Time Based)
          40020	FAIL	(SQL Injection Hypersonic Time Based)
          40021	FAIL	(SQL Injection Oracle Time Based)
          40022	FAIL	(SQL Injection PostgreSQL Time Based)
          40024	FAIL	(SQL Injection SQLite Time Based)
          40033	FAIL	(NoSQL Injection MongoDB)
          40046	FAIL	(Server Side Request Forgery)
          90019	FAIL	(Code Injection)
          90020	FAIL	(Command Injection)
          90023	FAIL	(XXE External Entity)
          90035	FAIL	(Server Side Template Injection)
          10020	WARN	(Anti-clickjacking Header)
          10021	WARN	(X-Content-Type-Options Header Missing)
          90022	WARN	(Application Error Disclosure)
          EOF

          echo "path=security/zap-rules.generated.tsv" >> "$GITHUB_OUTPUT"

      - name: Build middleware security-test image
        run: |
          set -euo pipefail
          docker build \
            --tag blockgo/middleware:security-ci \
            --file middleware/Dockerfile \
            middleware

      - name: Start isolated middleware security-test container
        run: |
          set -euo pipefail

          docker rm --force blockgo-security-api 2>/dev/null || true
          docker rm --force blockgo-security-auth 2>/dev/null || true
          docker network rm blockgo-security 2>/dev/null || true
          docker network create blockgo-security

          docker run \
            --detach \
            --name blockgo-security-auth \
            --network blockgo-security \
            --env PORT=4001 \
            --env NODE_ENV=test \
            --env CI=true \
            --env JWT_SECRET="ci-only-jwt-secret-not-production" \
            --env INTERNAL_API_KEY="ci-only-internal-key-not-production" \
            blockgo/middleware:security-ci \
            npm run start:auth

          docker run \
            --detach \
            --name blockgo-security-api \
            --network blockgo-security \
            --publish 4000:4000 \
            --env PORT=4000 \
            --env NODE_ENV=test \
            --env CI=true \
            --env JWT_SECRET="ci-only-jwt-secret-not-production" \
            --env INTERNAL_API_KEY="ci-only-internal-key-not-production" \
            --env FABRIC_BOOTSTRAP=false \
            --env AUTH_SERVICE_URL=http://blockgo-security-auth:4001 \
            blockgo/middleware:security-ci

      - name: Wait for middleware health endpoint
        run: |
          set -euo pipefail

          READY=0

          for ATTEMPT in $(seq 1 60); do
            STATUS="$(curl --silent --output /tmp/blockgo-health.json --write-out '%{http_code}' http://127.0.0.1:4000/api/health || true)"
            echo "Attempt $ATTEMPT/60 -> gateway HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Middleware security-test container failed to become healthy."
            docker logs blockgo-security-api || true
            exit 1
          fi

          cat /tmp/blockgo-health.json || true

      - name: Verify gateway-to-auth-service routing
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 2 \
            --output /tmp/hash-response.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"password":"ci-routing-check"}' \
            http://127.0.0.1:4000/api/crypto/hash-password)"

          if [ "$status" != "200" ]; then
            echo "::error::Gateway-to-auth-service route returned HTTP $status."
            cat /tmp/hash-response.json || true
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/hash-response.json", "utf8"));
            if (typeof body.hash !== "string" || !body.hash.startsWith("$2")) process.exit(1);
          '

      - name: Basic anonymous-access negative test
        run: |
          set -euo pipefail

          # If this endpoint exists, it must not return a successful 2xx to an
          # anonymous caller. 404 is accepted here because endpoint naming may
          # still change while the feature branch is under development.
          STATUS="$(curl --silent --output /tmp/anonymous.json --write-out '%{http_code}' http://127.0.0.1:4000/api/all-grades || true)"
          echo "Anonymous /api/all-grades -> HTTP $STATUS"

          if [[ "$STATUS" =~ ^2 ]]; then
            echo "::error::Potential authorization failure: anonymous request returned HTTP $STATUS."
            cat /tmp/anonymous.json || true
            exit 1
          fi

      - name: Schemathesis API property / fuzz tests
        id: schemathesis
        continue-on-error: true
        uses: schemathesis/action@v3
        with:
          schema: ${{ steps.schema.outputs.path }}
          base-url: http://127.0.0.1:4000
          checks: all
          max-examples: 50
          wait-for-schema: 30
          coverage: "true"
          coverage-report: "true"
          coverage-report-path: schemathesis-coverage.html
          coverage-artifact-name: schemathesis-feature-api-coverage
          coverage-pr-comment: "false"

      - name: Run OWASP ZAP API active scan
        id: zap
        continue-on-error: true
        env:
          OPENAPI_PATH: ${{ steps.schema.outputs.path }}
          ZAP_RULES_PATH: ${{ steps.zap-rules.outputs.path }}
        run: |
          set -uo pipefail
          mkdir -p security-results

          # The repository is mounted at /zap/wrk inside the ZAP container.
          # Use absolute container paths for local OpenAPI/config/report files.
          set +e
          timeout 60m docker run             --rm             --network host             --volume "$PWD:/zap/wrk/:rw"             ghcr.io/zaproxy/zaproxy:stable             zap-api-scan.py               -t "/zap/wrk/${OPENAPI_PATH}"               -f openapi               -c "/zap/wrk/${ZAP_RULES_PATH}"               -I               -r /zap/wrk/security-results/zap-report.html               -J /zap/wrk/security-results/zap-report.json               -w /zap/wrk/security-results/zap-report.md               -T 10
          ZAP_EXIT=$?
          set -e

          echo "ZAP exit code: $ZAP_EXIT"
          echo "exit_code=$ZAP_EXIT" >> "$GITHUB_OUTPUT"

          case "$ZAP_EXIT" in
            0)
              echo "ZAP security gate passed."
              ;;
            1)
              echo "::error::ZAP detected at least one finding configured as FAIL."
              exit 1
              ;;
            2)
              echo "::warning::ZAP produced warnings only."
              ;;
            124)
              echo "::error::ZAP exceeded the 60-minute safety timeout."
              exit 1
              ;;
            *)
              echo "::error::ZAP scanner failed unexpectedly with exit code $ZAP_EXIT."
              exit "$ZAP_EXIT"
              ;;
          esac

      - name: Run Nuclei high / critical vulnerability scan
        id: nuclei
        continue-on-error: true
        uses: projectdiscovery/nuclei-action@v3
        with:
          version: v3.6.0
          args: >-
            -u http://127.0.0.1:4000
            -severity high,critical
            -silent
            -jle nuclei-results.jsonl

      - name: Enforce Nuclei vulnerability gate
        id: nuclei-gate
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ -s nuclei-results.jsonl ]; then
            echo "::error::Nuclei detected HIGH or CRITICAL findings."
            cat nuclei-results.jsonl
            exit 1
          fi

          echo "Nuclei found no HIGH/CRITICAL findings."

      - name: Enforce all free API security scanners
        if: always()
        env:
          SCHEMATHESIS_OUTCOME: ${{ steps.schemathesis.outcome }}
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
          NUCLEI_OUTCOME: ${{ steps.nuclei.outcome }}
          NUCLEI_GATE_OUTCOME: ${{ steps.nuclei-gate.outcome }}
        run: |
          set -euo pipefail

          FAILED=0

          check_outcome() {
            local name="$1"
            local outcome="$2"

            if [ "$outcome" = "success" ]; then
              echo "PASS: $name"
            else
              echo "::error::$name -> ${outcome:-not-run}"
              FAILED=1
            fi
          }

          check_outcome "Schemathesis" "$SCHEMATHESIS_OUTCOME"
          check_outcome "OWASP ZAP" "$ZAP_OUTCOME"
          check_outcome "Nuclei execution" "$NUCLEI_OUTCOME"
          check_outcome "Nuclei HIGH/CRITICAL gate" "$NUCLEI_GATE_OUTCOME"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Free API security suite FAILED."
            exit 1
          fi

          echo "All free API security scanners passed."

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blockgo-zap-feature-api
          path: security-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Nuclei report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blockgo-nuclei-feature-api
          path: nuclei-results.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Show middleware logs on failure
        if: failure()
        run: |
          docker logs blockgo-security-api || true
          docker logs blockgo-security-auth || true

      - name: Stop middleware security-test container
        if: always()
        run: |
          docker rm --force blockgo-security-api 2>/dev/null || true
          docker rm --force blockgo-security-auth 2>/dev/null || true
          docker network rm blockgo-security 2>/dev/null || true

  feature-api-gate:
    name: Required Feature/API Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - heavy-tests
      - static-security
      - free-api-security
    timeout-minutes: 5

    steps:
      - name: Evaluate all Feature/API gates
        env:
          HEAVY_RESULT: ${{ needs.heavy-tests.result }}
          STATIC_SECURITY_RESULT: ${{ needs.static-security.result }}
          SECURITY_RESULT: ${{ needs.free-api-security.result }}
        run: |
          set -euo pipefail

          FAILED=0

          check_job() {
            NAME="$1"
            RESULT="$2"

            if [ "$RESULT" = "success" ]; then
              echo "PASS: $NAME"
            else
              echo "::error::$NAME -> $RESULT"
              FAILED=1
            fi
          }

          check_job "Heavy integration/container tests" "$HEAVY_RESULT"
          check_job "Static/supply-chain security" "$STATIC_SECURITY_RESULT"
          check_job "Schemathesis/ZAP/Nuclei security tests" "$SECURITY_RESULT"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Feature/API Endpoint gate FAILED."
            exit 1
          fi

          echo "=========================================="
          echo "FEATURE / API ENDPOINT GATE PASSED"
          echo "=========================================="
          echo "Eligible for promotion to Staging-and-Testing."

  promote:
    name: Promote → Staging-and-Testing
    needs:
      - heavy-tests
      - feature-api-gate

    if: >-
      success() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/feature/api-endpoints-Testing'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.promote == true
        )
      )

    permissions:
      contents: read

    uses: ./.github/workflows/promote.yml

    with:
      source_branch: feature/api-endpoints-Testing
      target_branch: Staging-and-Testing
      tested_sha: ${{ needs.heavy-tests.outputs.tested_sha }}

    secrets:
      PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
