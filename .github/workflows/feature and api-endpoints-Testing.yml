name: Feature / API Endpoint Heavy Tests

on:
  push:
    branches:
      - feature/api-endpoints-Testing

  pull_request:
    branches:
      - feature/api-endpoints-Testing

  workflow_dispatch:
    inputs:
      promote:
        description: "Promote to Staging-and-Testing after all tests pass"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: feature-api-tests-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  CI: "true"
  DOCKER_BUILDKIT: "1"


defaults:
  run:
    shell: bash

jobs:
  heavy-tests:
    name: Heavy Integration, Container & Route Tests
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blockgo_ci
          POSTGRES_PASSWORD: blockgo_ci_password
          POSTGRES_DB: blockgo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockgo_ci -d blockgo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    outputs:
      tested_sha: ${{ steps.resolve-sha.outputs.sha }}

    steps:
      - name: Checkout triggering revision
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Feature/API branch for manual/scheduled run
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: feature/api-endpoints-Testing
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact tested commit
        id: resolve-sha
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Testing exact commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify required application structure
        run: |
          set -euo pipefail

          FAILED=0

          require_dir() {
            if [ ! -d "$1" ]; then
              echo "::error::Required directory missing: $1"
              FAILED=1
            else
              echo "FOUND directory: $1"
            fi
          }

          require_file() {
            if [ ! -f "$1" ]; then
              echo "::error::Required file missing: $1"
              FAILED=1
            else
              echo "FOUND file: $1"
            fi
          }

          require_dir frontend
          require_dir middleware
          require_dir chaincode
          require_dir client-app

          require_file frontend/package.json
          require_file frontend/package-lock.json
          require_file frontend/Dockerfile

          require_file middleware/package.json
          require_file middleware/package-lock.json
          require_file middleware/Dockerfile

          require_file chaincode/go.mod
          require_file chaincode/go.sum

          require_file client-app/Dockerfile
          require_file security/openapi-ci.yaml
          require_file security/zap-rules.tsv

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Repository preflight failed."
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            middleware/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chaincode/go.mod
          cache-dependency-path: chaincode/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false

      - name: Frontend lint
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test -- --watchAll=false --runInBand

      - name: Build frontend production bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Frontend production dependency audit
        working-directory: frontend
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Install middleware dependencies
        working-directory: middleware
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false

      - name: Middleware lint
        working-directory: middleware
        run: |
          set -euo pipefail
          npm run lint

      - name: Run middleware base tests
        working-directory: middleware
        run: |
          set -euo pipefail
          npm test

      - name: Run middleware API, integration, and E2E suites
        working-directory: middleware
        run: |
          set -euo pipefail
          npm run test:api
          npm run test:integration
          npm run test:e2e

      - name: Middleware production dependency audit
        working-directory: middleware
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Verify Go modules
        working-directory: chaincode
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Vet chaincode
        working-directory: chaincode
        run: |
          set -euo pipefail
          go vet ./...

      - name: Run chaincode unit and race tests
        working-directory: chaincode
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

      - name: Run .NET regression checks
        env:
          SECTIONING_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=blockgo_ci;Username=blockgo_ci;Password=blockgo_ci_password
        run: |
          set -euo pipefail
          dotnet run --project tests/EnrollmentImportChecks/EnrollmentImportChecks.csproj --configuration Release
          dotnet run --project tests/EnrollmentSectioningChecks/EnrollmentSectioningChecks.csproj --configuration Release

      - name: Build and test client-app
        run: |
          set -euo pipefail
          dotnet test client-app/For_Testing_Only_Capstone.csproj --configuration Release --verbosity minimal

      - name: Build current application images
        run: |
          set -euo pipefail

          docker build --pull \
            --tag blockgo/frontend:ci \
            --file frontend/Dockerfile \
            frontend

          docker build --pull \
            --tag blockgo/middleware:ci \
            --file middleware/Dockerfile \
            middleware

          docker build --pull \
            --tag blockgo/client-app:ci \
            --file client-app/Dockerfile \
            client-app

      - name: Verify built images
        run: |
          set -euo pipefail

          for IMAGE in \
            blockgo/frontend:ci \
            blockgo/middleware:ci \
            blockgo/client-app:ci
          do
            docker image inspect "$IMAGE" >/dev/null
            echo "PASS: $IMAGE"
          done

      - name: Start frontend production-like container
        run: |
          set -euo pipefail
          docker rm --force blockgo-route-test 2>/dev/null || true
          docker run \
            --detach \
            --name blockgo-route-test \
            --publish 8080:80 \
            blockgo/frontend:ci

      - name: Wait for frontend container readiness
        run: |
          set -euo pipefail

          READY=0

          for ATTEMPT in $(seq 1 45); do
            STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/login || true)"
            echo "Attempt $ATTEMPT/45 -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Frontend container did not become ready."
            docker logs blockgo-route-test || true
            exit 1
          fi

      - name: Verify SPA deep routes
        run: |
          set -euo pipefail

          ROUTES=(
            login
            registrar
            department-admin
            faculty
            student
            system-admin
          )

          FAILED=0

          for ROUTE in "${ROUTES[@]}"; do
            RESPONSE_FILE="/tmp/blockgo-${ROUTE}.html"
            STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' "http://127.0.0.1:8080/${ROUTE}")"

            if [ "$STATUS" != "200" ]; then
              echo "::error::/${ROUTE} returned HTTP ${STATUS}"
              FAILED=1
              continue
            fi

            if ! grep -Eq "<div[^>]*id=[\"']root[\"'][^>]*>" "$RESPONSE_FILE"; then
              echo "::error::/${ROUTE} does not contain the React root element."
              FAILED=1
              continue
            fi

            echo "PASS: /${ROUTE} -> HTTP ${STATUS}"
          done

          if [ "$FAILED" -ne 0 ]; then
            docker logs blockgo-route-test || true
            exit 1
          fi

      - name: Inspect frontend security headers
        run: |
          set -euo pipefail

          HEADERS="/tmp/blockgo-headers.txt"
          curl --silent --show-error --dump-header "$HEADERS" --output /dev/null http://127.0.0.1:8080/login

          for HEADER in X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            if grep -qi "^${HEADER}:" "$HEADERS"; then
              echo "FOUND: $HEADER"
            else
              echo "::warning::Recommended HTTP header missing: $HEADER"
            fi
          done

      - name: Stop frontend route-test container
        if: always()
        run: docker rm --force blockgo-route-test 2>/dev/null || true

      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker images || true
          docker system df || true

  free-api-security:
    name: Free API Security — Schemathesis / ZAP / Nuclei
    runs-on: ubuntu-latest
    needs:
      - heavy-tests
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.heavy-tests.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare OpenAPI schema for CI security tests
        id: schema
        run: |
          set -euo pipefail
          mkdir -p security security-results
          test -f security/openapi-ci.yaml
          echo "Using repository-managed security/openapi-ci.yaml"
          echo "path=security/openapi-ci.yaml" >> "$GITHUB_OUTPUT"

      - name: Ensure OpenAPI schema targets only the local CI API
        env:
          OPENAPI_PATH: ${{ steps.schema.outputs.path }}
        run: |
          set -euo pipefail

          # ZAP reads server URLs from the OpenAPI document. Refuse to scan a
          # repository-managed schema unless it explicitly points at the isolated
          # middleware container on this GitHub runner.
          if ! grep -Eq 'url:[[:space:]]*["'"'"']?http://127\.0\.0\.1:4000["'"'"']?[[:space:]]*$' "$OPENAPI_PATH"; then
            echo "::error::The CI OpenAPI schema must contain:"
            echo "::error::  server URL: http://127.0.0.1:4000"
            echo "::error::This safety check prevents ZAP from accidentally scanning staging or production."
            exit 1
          fi

          echo "OpenAPI target is restricted to the local CI middleware."

      - name: Prepare ZAP rule policy
        id: zap-rules
        run: |
          set -euo pipefail
          mkdir -p security

          test -f security/zap-rules.tsv
          echo "Using repository-managed security/zap-rules.tsv"
          echo "path=security/zap-rules.tsv" >> "$GITHUB_OUTPUT"

      - name: Build middleware security-test image
        run: |
          set -euo pipefail
          docker build \
            --tag blockgo/middleware:security-ci \
            --file middleware/Dockerfile \
            middleware

      - name: Start isolated middleware security-test stack
        run: |
          set -euo pipefail

          docker network create blockgo-security-ci
          docker run --detach --name blockgo-security-db --network blockgo-security-ci \
            --env POSTGRES_USER=blockgo_ci \
            --env POSTGRES_PASSWORD=blockgo_ci_password \
            --env POSTGRES_DB=blockgo_ci \
            postgres:16-alpine

          for ATTEMPT in $(seq 1 60); do
            if docker exec blockgo-security-db pg_isready -U blockgo_ci -d blockgo_ci >/dev/null 2>&1; then
              break
            fi
            if [ "$ATTEMPT" -eq 60 ]; then
              docker logs blockgo-security-db
              exit 1
            fi
            sleep 1
          done
          docker exec --interactive blockgo-security-db \
            psql --set ON_ERROR_STOP=1 -U blockgo_ci -d blockgo_ci \
            < network/init-db-schema.sql

          COMMON_ENV=(
            --env NODE_ENV=test
            --env CI=true
            --env JWT_SECRET=ci-only-jwt-secret-not-production
            --env INTERNAL_API_KEY=ci-only-internal-key-not-production
            --env POSTGRES_HOST=blockgo-security-db
            --env POSTGRES_PORT=5432
            --env POSTGRES_USER=blockgo_ci
            --env POSTGRES_PASS=blockgo_ci_password
            --env POSTGRES_DB=blockgo_ci
            --env FABRIC_BOOTSTRAP=false
          )

          docker run --detach --name blockgo-security-auth --network blockgo-security-ci \
            "${COMMON_ENV[@]}" --env PORT=4001 \
            --env IDENTITY_SERVICE_URL=http://blockgo-security-identity:4002 \
            blockgo/middleware:security-ci npm run start:auth
          docker run --detach --name blockgo-security-identity --network blockgo-security-ci \
            "${COMMON_ENV[@]}" --env PORT=4002 \
            --env LEDGER_SERVICE_URL=http://blockgo-security-ledger:4003 \
            blockgo/middleware:security-ci npm run start:identity
          docker run --detach --name blockgo-security-ledger --network blockgo-security-ci \
            "${COMMON_ENV[@]}" --env PORT=4003 \
            --env AUTH_SERVICE_URL=http://blockgo-security-auth:4001 \
            blockgo/middleware:security-ci npm run start:ledger
          docker run --detach --name blockgo-security-upload --network blockgo-security-ci \
            "${COMMON_ENV[@]}" --env PORT=4004 \
            --env AUTH_SERVICE_URL=http://blockgo-security-auth:4001 \
            blockgo/middleware:security-ci npm run start:upload
          docker run --detach --name blockgo-security-settings --network blockgo-security-ci \
            "${COMMON_ENV[@]}" --env PORT=4005 \
            --env AUTH_SERVICE_URL=http://blockgo-security-auth:4001 \
            blockgo/middleware:security-ci npm run start:settings
          docker run --detach --name blockgo-security-api --network blockgo-security-ci \
            --publish 4000:4000 \
            --env PORT=4000 \
            --env NODE_ENV=test \
            --env CI=true \
            --env AUTH_SERVICE_URL=http://blockgo-security-auth:4001 \
            --env IDENTITY_SERVICE_URL=http://blockgo-security-identity:4002 \
            --env LEDGER_SERVICE_URL=http://blockgo-security-ledger:4003 \
            --env UPLOAD_SERVICE_URL=http://blockgo-security-upload:4004 \
            --env SETTINGS_SERVICE_URL=http://blockgo-security-settings:4005 \
            blockgo/middleware:security-ci npm run start:gateway

      - name: Wait for middleware health endpoint
        run: |
          set -euo pipefail

          READY=0

          for ATTEMPT in $(seq 1 60); do
            STATUS="$(curl --silent --output /tmp/blockgo-health.json --write-out '%{http_code}' http://127.0.0.1:4000/api/health || true)"
            echo "Attempt $ATTEMPT/60 -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Middleware security-test container failed to become healthy."
            docker logs blockgo-security-api || true
            exit 1
          fi

          cat /tmp/blockgo-health.json || true

          for SERVICE in auth identity ledger upload settings; do
            STATUS="$(docker exec blockgo-security-${SERVICE} node -e \
              "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => { console.log(r.status); process.exit(r.ok ? 0 : 1); }).catch(() => process.exit(1))")"
            echo "${SERVICE} service health -> HTTP ${STATUS}"
          done

      - name: Basic anonymous-access negative test
        run: |
          set -euo pipefail

          STATUS="$(curl --silent --output /tmp/anonymous.json --write-out '%{http_code}' http://127.0.0.1:4000/api/all-grades || true)"
          echo "Anonymous /api/all-grades -> HTTP $STATUS"

          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "::error::Anonymous protected endpoint must return 401/403, not HTTP $STATUS."
            cat /tmp/anonymous.json || true
            exit 1
          fi

      - name: Schemathesis API property / fuzz tests
        id: schemathesis
        continue-on-error: true
        uses: schemathesis/action@v3
        with:
          schema: ${{ steps.schema.outputs.path }}
          base-url: http://127.0.0.1:4000
          checks: all
          max-examples: 50
          wait-for-schema: 30
          coverage: "true"
          coverage-report: "true"
          coverage-report-path: schemathesis-coverage.html
          coverage-artifact-name: schemathesis-feature-api-coverage
          coverage-pr-comment: "false"

      - name: Run OWASP ZAP API active scan
        id: zap
        continue-on-error: true
        env:
          OPENAPI_PATH: ${{ steps.schema.outputs.path }}
          ZAP_RULES_PATH: ${{ steps.zap-rules.outputs.path }}
        run: |
          set -uo pipefail
          mkdir -p security-results

          # The repository is mounted at /zap/wrk inside the ZAP container.
          # Use absolute container paths for local OpenAPI/config/report files.
          set +e
          timeout 60m docker run \
            --rm \
            --network host \
            --volume "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t "/zap/wrk/${OPENAPI_PATH}" \
              -f openapi \
              -c "/zap/wrk/${ZAP_RULES_PATH}" \
              -a \
              -I \
              -r /zap/wrk/security-results/zap-report.html \
              -J /zap/wrk/security-results/zap-report.json \
              -w /zap/wrk/security-results/zap-report.md \
              -T 10
          ZAP_EXIT=$?
          set -e

          echo "ZAP exit code: $ZAP_EXIT"
          echo "exit_code=$ZAP_EXIT" >> "$GITHUB_OUTPUT"

          case "$ZAP_EXIT" in
            0)
              echo "ZAP security gate passed."
              ;;
            1)
              echo "::error::ZAP detected at least one finding configured as FAIL."
              exit 1
              ;;
            2)
              echo "::warning::ZAP produced warnings only."
              ;;
            124)
              echo "::error::ZAP exceeded the 60-minute safety timeout."
              exit 1
              ;;
            *)
              echo "::error::ZAP scanner failed unexpectedly with exit code $ZAP_EXIT."
              exit "$ZAP_EXIT"
              ;;
          esac

      - name: Run Nuclei high / critical vulnerability scan
        id: nuclei
        continue-on-error: true
        uses: projectdiscovery/nuclei-action@v3
        with:
          target: http://127.0.0.1:4000
          jsonl-export: nuclei-results.jsonl
          omit-raw: true
          flags: "-severity high,critical -silent"

      - name: Enforce Nuclei vulnerability gate
        id: nuclei-gate
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ -s nuclei-results.jsonl ]; then
            echo "::error::Nuclei detected HIGH or CRITICAL findings."
            cat nuclei-results.jsonl
            exit 1
          fi

          echo "Nuclei found no HIGH/CRITICAL findings."

      - name: Enforce all free API security scanners
        if: always()
        env:
          SCHEMATHESIS_OUTCOME: ${{ steps.schemathesis.outcome }}
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
          NUCLEI_OUTCOME: ${{ steps.nuclei.outcome }}
          NUCLEI_GATE_OUTCOME: ${{ steps.nuclei-gate.outcome }}
        run: |
          set -euo pipefail

          FAILED=0

          check_outcome() {
            local name="$1"
            local outcome="$2"

            if [ "$outcome" = "success" ]; then
              echo "PASS: $name"
            else
              echo "::error::$name -> ${outcome:-not-run}"
              FAILED=1
            fi
          }

          check_outcome "Schemathesis" "$SCHEMATHESIS_OUTCOME"
          check_outcome "OWASP ZAP" "$ZAP_OUTCOME"
          check_outcome "Nuclei execution" "$NUCLEI_OUTCOME"
          check_outcome "Nuclei HIGH/CRITICAL gate" "$NUCLEI_GATE_OUTCOME"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Free API security suite FAILED."
            exit 1
          fi

          echo "All free API security scanners passed."

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockgo-zap-feature-api
          path: security-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Nuclei report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockgo-nuclei-feature-api
          path: nuclei-results.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Show middleware logs on failure
        if: failure()
        run: |
          for CONTAINER in blockgo-security-api blockgo-security-auth blockgo-security-identity blockgo-security-ledger blockgo-security-upload blockgo-security-settings blockgo-security-db; do
            echo "===== ${CONTAINER} ====="
            docker logs "$CONTAINER" 2>&1 || true
          done

      - name: Stop middleware security-test stack
        if: always()
        run: |
          docker rm --force \
            blockgo-security-api \
            blockgo-security-auth \
            blockgo-security-identity \
            blockgo-security-ledger \
            blockgo-security-upload \
            blockgo-security-settings \
            blockgo-security-db \
            2>/dev/null || true
          docker network rm blockgo-security-ci 2>/dev/null || true

  feature-api-gate:
    name: Required Feature/API Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - heavy-tests
      - free-api-security
    timeout-minutes: 5

    steps:
      - name: Evaluate all Feature/API gates
        env:
          HEAVY_RESULT: ${{ needs.heavy-tests.result }}
          SECURITY_RESULT: ${{ needs.free-api-security.result }}
        run: |
          set -euo pipefail

          FAILED=0

          check_job() {
            NAME="$1"
            RESULT="$2"

            if [ "$RESULT" = "success" ]; then
              echo "PASS: $NAME"
            else
              echo "::error::$NAME -> $RESULT"
              FAILED=1
            fi
          }

          check_job "Heavy integration/container tests" "$HEAVY_RESULT"
          check_job "Schemathesis/ZAP/Nuclei security tests" "$SECURITY_RESULT"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Feature/API Endpoint gate FAILED."
            exit 1
          fi

          echo "=========================================="
          echo "FEATURE / API ENDPOINT GATE PASSED"
          echo "=========================================="
          echo "Eligible for promotion to Staging-and-Testing."

  promote:
    name: Promote → Staging-and-Testing
    needs:
      - heavy-tests
      - feature-api-gate

    if: >-
      success() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/feature/api-endpoints-Testing'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.promote == true
        )
      )

    permissions:
      contents: read

    uses: ./.github/workflows/promote.yml

    with:
      source_branch: feature/api-endpoints-Testing
      target_branch: Staging-and-Testing
      tested_sha: ${{ needs.heavy-tests.outputs.tested_sha }}

    secrets:
      PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
