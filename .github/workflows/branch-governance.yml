name: Configure Branch Governance

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GOVERNANCE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: branch-governance
  cancel-in-progress: false

jobs:
  protect-promotion-branches:
    name: Protect staging and main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-governance
    env:
      GH_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require an administration token
        shell: bash
        run: |
          test -n "$GH_TOKEN" || {
            echo "GOVERNANCE_TOKEN must have repository Administration read/write permission."
            exit 1
          }

      - name: Enable repository auto-merge
        shell: bash
        run: gh api --method PATCH "repos/$GH_REPO" -F allow_auto_merge=true >/dev/null

      - name: Require every quality gate on protected branches
        shell: bash
        run: |
          for branch in Staging-and-Testing main; do
            gh api "repos/$GH_REPO/branches/$branch" >/dev/null
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GH_REPO/branches/$branch/protection" \
              --input - <<'JSON' >/dev/null
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["quality-gate"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": true
          }
          JSON
          done

      - name: Verify applied protections
        shell: bash
        run: |
          for branch in Staging-and-Testing main; do
            response="$(gh api "repos/$GH_REPO/branches/$branch/protection")"
            jq -e '
              .required_status_checks.strict == true and
              (.required_status_checks.contexts | index("quality-gate")) != null and
              .enforce_admins.enabled == true and
              .required_pull_request_reviews.required_approving_review_count == 0 and
              .allow_force_pushes.enabled == false and
              .allow_deletions.enabled == false and
              .required_conversation_resolution.enabled == true
            ' <<<"$response" >/dev/null
          done
