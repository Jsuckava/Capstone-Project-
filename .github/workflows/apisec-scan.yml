name: Develop-and-Integration APIsec Scan

on:
  push:
    branches: [Develop-and-Integration]
  pull_request:
    branches: [Develop-and-Integration]
  schedule:
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      APISEC_USERNAME: ${{ secrets.apisec_username }}
      APISEC_PASSWORD: ${{ secrets.apisec_password }}
      APISEC_PROJECT: ${{ vars.APISEC_PROJECT }}

    steps:
      - name: Explain skipped scan
        if: ${{ env.APISEC_USERNAME == '' || env.APISEC_PASSWORD == '' || env.APISEC_PROJECT == '' }}
        run: echo "Configure apisec_username, apisec_password, and the APISEC_PROJECT repository variable to enable APIsec."

      - name: Run APIsec scan
        if: ${{ env.APISEC_USERNAME != '' && env.APISEC_PASSWORD != '' && env.APISEC_PROJECT != '' }}
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ env.APISEC_USERNAME }}
          apisec-password: ${{ env.APISEC_PASSWORD }}
          apisec-project: ${{ env.APISEC_PROJECT }}
          sarif-result-file: apisec-results.sarif

      - name: Upload APIsec SARIF
        if: ${{ env.APISEC_USERNAME != '' && env.APISEC_PASSWORD != '' && env.APISEC_PROJECT != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apisec-results.sarif
