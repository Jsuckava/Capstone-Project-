name: Develop-and-Integration Frontend Routes and Container Builds

on:
  push:
    branches: [Develop-and-Integration]
  pull_request:
    branches: [Develop-and-Integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Develop-and-Integration-containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-and-route-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Develop-and-Integration source
        uses: actions/checkout@v4

      - name: Build current application images
        run: |
          docker build -t blockgo/frontend:ci -f frontend/Dockerfile frontend
          docker build -t blockgo/middleware:ci -f middleware/Dockerfile middleware
          docker build -t blockgo/client-app:ci -f client-app/Dockerfile client-app

      - name: Start frontend production container
        run: docker run --detach --name blockgo-route-test --publish 8080:80 blockgo/frontend:ci

      - name: Verify production deep links
        shell: bash
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/login >/dev/null; then
              break
            fi
            sleep 1
          done

          for route in login registrar department-admin faculty student system-admin; do
            response_file="/tmp/blockgo-${route}.html"
            status="$(curl --silent --output "$response_file" --write-out '%{http_code}' "http://127.0.0.1:8080/${route}")"
            test "$status" = "200"
            grep -q '<div id="root"></div>' "$response_file"
            echo "/${route} -> HTTP ${status}"
          done

      - name: Verify deployed bundle contains session routes
        run: |
          docker exec blockgo-route-test grep -R -q 'blockgo.auth.token' /usr/share/nginx/html/static/js
          docker exec blockgo-route-test grep -R -q '/department-admin' /usr/share/nginx/html/static/js
          ! docker exec blockgo-route-test grep -R -q 'New Login Tab' /usr/share/nginx/html/static/js

      - name: Container diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs blockgo-route-test || true

      - name: Stop test container
        if: always()
        run: docker rm --force blockgo-route-test 2>/dev/null || true
