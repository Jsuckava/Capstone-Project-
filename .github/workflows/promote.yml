name: Promote Passed Branch

on:
  workflow_call:
    inputs:
      source_branch:
        description: Branch whose successfully tested commit will be promoted
        required: true
        type: string
      target_branch:
        description: Protected branch that receives the promotion pull request
        required: true
        type: string
    secrets:
      PROMOTION_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ inputs.source_branch }} to ${{ inputs.target_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the permitted promotion path
        env:
          SOURCE: ${{ inputs.source_branch }}
          TARGET: ${{ inputs.target_branch }}
        shell: bash
        run: |
          if [[ "$SOURCE" == "Develop-and-Integration" && "$TARGET" == "Staging-and-Testing" ]]; then exit 0; fi
          if [[ "$SOURCE" == "Staging-and-Testing" && "$TARGET" == "main" ]]; then exit 0; fi
          echo "Promotion path $SOURCE -> $TARGET is not permitted."
          exit 1

      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh not found, installing..."
            sudo apt-get update -y
            sudo apt-get install -y gh
          else
            echo "gh found: $(gh --version)"
          fi

      - name: Authenticate gh with PROMOTION_TOKEN
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PROMOTION_TOKEN is empty"
            exit 1
          fi
          echo "$GH_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Open promotion pull request and enable gated auto-merge
        env:
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.source_branch }}
          TARGET: ${{ inputs.target_branch }}
        shell: bash
        run: |
          owner="$(echo "$GH_REPO" | cut -d/ -f1)"
          repo="$(echo "$GH_REPO" | cut -d/ -f2)"
          head="${owner}:${SOURCE}"
          echo "Looking for an existing PR from $head -> $TARGET"
          number="$(gh pr list --repo "$GH_REPO" --head "$head" --base "$TARGET" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            echo "No existing PR found; creating PR..."
            gh pr create --repo "$GH_REPO" \
              --head "$SOURCE" \
              --base "$TARGET" \
              --title "Promote ${SOURCE} → ${TARGET}" \
              --body "Automated promotion after pipeline gates passed. This PR was created by the promotion workflow."
            number="$(gh pr list --repo "$GH_REPO" --head "$head" --base "$TARGET" --state open --json number --jq '.[0].number')"
            if [[ -z "$number" ]]; then
              echo "Failed to create PR."
              gh pr list --repo "$GH_REPO" --head "$head" --base "$TARGET" --state open --limit 5 --json number,title || true
              exit 1
            fi
            echo "Created PR #$number"
          else
            echo "Using existing PR #$number"
          fi

          echo "Enabling auto-merge for PR #$number (if permitted) and queueing merge..."
          # Try to enable auto-merge; if not permitted this may still schedule a regular merge
          gh pr merge "$number" --repo "$GH_REPO" --auto --merge || {
            echo "gh pr merge returned non-zero; attempting a direct merge as fallback (may fail if branch protection prevents it)"
            gh pr merge "$number" --repo "$GH_REPO" --merge || {
              echo "Merge failed; leaving PR open for manual review or for auto-merge to complete once checks/approvals pass."
            }
          }