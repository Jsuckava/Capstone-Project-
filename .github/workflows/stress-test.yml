name: Develop-and-Integration Frontend Route Stress Test

on:
  pull_request:
    branches: [Develop-and-Integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Develop-and-Integration-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Develop-and-Integration source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and start frontend
        run: |
          docker build -t blockgo/frontend:stress -f frontend/Dockerfile frontend
          docker run --detach --name blockgo-frontend-stress --publish 8080:80 blockgo/frontend:stress
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/login >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Stress login and role deep links
        run: |
          npx --yes autocannon@8.0.0 --connections 50 --duration 10 http://127.0.0.1:8080/login
          npx --yes autocannon@8.0.0 --connections 50 --duration 10 http://127.0.0.1:8080/registrar
          npx --yes autocannon@8.0.0 --connections 50 --duration 10 http://127.0.0.1:8080/faculty

      - name: Confirm routes remain healthy
        run: |
          curl --fail http://127.0.0.1:8080/login >/dev/null
          curl --fail http://127.0.0.1:8080/department-admin >/dev/null
          curl --fail http://127.0.0.1:8080/student >/dev/null

      - name: Frontend diagnostics
        if: failure()
        run: docker logs blockgo-frontend-stress || true

      - name: Stop stress container
        if: always()
        run: docker rm --force blockgo-frontend-stress 2>/dev/null || true
