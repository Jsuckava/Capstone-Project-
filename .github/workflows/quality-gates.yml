name: Quality Gates

on:
  push:
    branches: [Backup-2, Staging-and-Testing, main]
  pull_request:
    branches: [Backup-2, Staging-and-Testing, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    name: TDD
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            middleware/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: "8.0.x"}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: chaincode/go.mod
          cache-dependency-path: chaincode/go.sum
      - name: Middleware tests
        working-directory: middleware
        run: npm ci --no-audit && npm test
      - name: Frontend tests and production build
        working-directory: frontend
        env: {CI: "true"}
        run: npm ci --no-audit && npm test -- --watchAll=false && npm run build
      - name: ASP.NET build
        run: dotnet build client-app/For_Testing_Only_Capstone.csproj --configuration Release
      - name: Chaincode tests
        working-directory: chaincode
        run: go test ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject generated credentials and ledger artifacts
        shell: bash
        run: |
          tracked="$(git ls-files network/crypto-config-final-v2 network/fabric-ca network/channel-artifacts-final network/channel-artifacts-k8s network/fabric-k8s-data network/ipfs_data network/swarm.key)"
          if [[ -n "$tracked" ]]; then
            echo "Generated credentials or runtime artifacts are tracked:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with: {languages: "${{ matrix.language }}"}
      - uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            middleware/package-lock.json
      - name: Reject high or critical runtime vulnerabilities
        run: |
          npm --prefix frontend ci --omit=dev --ignore-scripts --no-audit
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix middleware ci --omit=dev --ignore-scripts --no-audit
          npm --prefix middleware audit --omit=dev --audit-level=high

  deployment-contracts:
    name: Deployment Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
      - name: Validate shell and deployment inputs
        run: |
          bash -n network/k8s/deploy-k8s.sh network/k8s/create-crypto-secrets.sh network/k8s/join-peers.sh network/k8s/install-chaincode.sh
          bash network/k8s/deploy-k8s.sh local verify
      - name: Validate GitHub workflow architecture
        run: |
          test -s .github/workflows/quality-gates.yml
          test -s .github/workflows/promote.yml
          test -s .github/workflows/branch-governance.yml
          test ! -e .github/workflows/terraform-governance.yml
          test ! -e infrastructure/github/main.tf
          grep -Fq 'Staging-and-Testing' .github/workflows/quality-gates.yml
          grep -Fq 'Staging-and-Testing' .github/workflows/promote.yml
          grep -Fq 'quality-gate' .github/workflows/branch-governance.yml
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Validate Kubernetes schemas offline
        run: |
          validator=ghcr.io/yannh/kubeconform:v0.7.0
          docker run --rm -i "$validator" -strict -summary - < monitoring/observability-stack.yaml
          docker run --rm -i "$validator" -strict -summary - < network/k8s/04a-postgres-configmap.yaml
          sed -e 's/__GKE_ZONE_A__/zone-a/g' -e 's/__GKE_ZONE_B__/zone-b/g' -e 's/__GKE_ZONE_C__/zone-c/g' network/k8s/07-peer-secondary.yaml |
            docker run --rm -i "$validator" -strict -summary -

  smoke:
    name: Strict Endpoint Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production containers
        run: |
          docker build -t blockgo/frontend:ci -f frontend/Dockerfile frontend
          docker build -t blockgo/middleware:ci -f middleware/Dockerfile middleware
          docker build -t blockgo/client-app:ci -f client-app/Dockerfile client-app
      - name: Verify public routes and reject manual database routes
        run: |
          docker run -d --name blockgo-smoke -p 8080:80 blockgo/frontend:ci
          for _ in {1..30}; do curl -fsS http://127.0.0.1:8080/login >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/login >/dev/null
          for route in login registrar department-admin faculty student system-admin; do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "http://127.0.0.1:8080/$route")"
            test "$code" = 200
            grep -q '<div id="root"></div>' "$body"
          done
          for route in _utils _utils/ _all_dbs _up _node _session couchdb couchdb-registrar; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$route")"
            test "$code" = 404
          done
      - name: Diagnostics
        if: failure()
        run: docker logs blockgo-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f blockgo-smoke 2>/dev/null || true

  stress:
    name: XP Stress Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "20"}
      - name: Stress role routes
        run: |
          docker build -t blockgo/frontend:stress -f frontend/Dockerfile frontend
          docker run -d --name blockgo-stress -p 8080:80 blockgo/frontend:stress
          for _ in {1..30}; do curl -fsS http://127.0.0.1:8080/login >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/login >/dev/null
          for route in login registrar department-admin faculty student; do
            result="autocannon-${route}.json"
            npx --yes autocannon@8.0.0 --connections 50 --duration 8 --json \
              "http://127.0.0.1:8080/$route" > "$result"
            node - "$result" "$route" <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const route = process.argv[3];
          const failures = (result.errors || 0) + (result.timeouts || 0) + (result.non2xx || 0);
          if (!result.requests || result.requests.total < 1) throw new Error(`${route}: no requests completed`);
          if (failures > 0) throw new Error(`${route}: ${failures} failed requests`);
          if (!result.latency || result.latency.p99 > 2000) {
            throw new Error(`${route}: p99 latency ${result.latency?.p99 ?? 'missing'} ms exceeds 2000 ms`);
          }
          NODE
          done
      - name: Cleanup
        if: always()
        run: docker rm -f blockgo-stress 2>/dev/null || true

  quality-gate:
    name: quality-gate
    if: always()
    runs-on: ubuntu-latest
    needs: [tdd, security, dependency-review, dependency-audit, deployment-contracts, smoke, stress]
    steps:
      - name: Require every mandatory gate
        env:
          TDD: ${{ needs.tdd.result }}
          SECURITY: ${{ needs.security.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          CONTRACTS: ${{ needs.deployment-contracts.result }}
          SMOKE: ${{ needs.smoke.result }}
          STRESS: ${{ needs.stress.result }}
        run: |
          test "$TDD" = success
          test "$SECURITY" = success
          test "$DEPENDENCY_AUDIT" = success
          test "$CONTRACTS" = success
          test "$SMOKE" = success
          test "$STRESS" = success
          test "$DEPENDENCIES" = success || test "$DEPENDENCIES" = skipped

  configure-governance:
    name: Verify GitHub branch governance
    needs: [quality-gate]
    if: github.event_name == 'push' && (github.ref_name == 'Backup-2' || github.ref_name == 'Staging-and-Testing')
    uses: ./.github/workflows/branch-governance.yml
    secrets: inherit

  promote-to-staging:
    name: Promote Backup-2 to staging
    needs: [quality-gate, configure-governance]
    if: github.event_name == 'push' && github.ref_name == 'Backup-2'
    uses: ./.github/workflows/promote.yml
    with:
      source_branch: Backup-2
      target_branch: Staging-and-Testing
    secrets: inherit

  promote-to-main:
    name: Promote staging to main
    needs: [quality-gate, configure-governance]
    if: github.event_name == 'push' && github.ref_name == 'Staging-and-Testing'
    uses: ./.github/workflows/promote.yml
    with:
      source_branch: Staging-and-Testing
      target_branch: main
    secrets: inherit
