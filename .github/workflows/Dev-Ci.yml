name: Develop-and-Integration

on:
  push:
    branches: [Develop-and-Integration]
  pull_request:
    branches: [Develop-and-Integration]
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote to feature/api-endpoints-Testing after all checks pass"
        required: false
        default: false
        type: boolean
  workflow_call:
    secrets:
      PROMOTION_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: dev-ci-failsafe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

defaults:
  run:
    shell: bash

jobs:
  frontend-tests:
    name: Frontend — Unit, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 10
        run: |
          set -euo pipefail
          npm install --global npm@10
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --fund=false

      - name: Frontend lint if configured
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run lint --if-present

      - name: Frontend unit tests
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test -- --watchAll=false

      - name: Frontend production build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

  middleware-tests:
    name: Middleware — Unit, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Use npm 10
        run: |
          set -euo pipefail
          npm install --global npm@10
          node --version
          npm --version

      - name: Install middleware dependencies
        working-directory: middleware
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --fund=false

      - name: Middleware lint if configured
        working-directory: middleware
        run: |
          set -euo pipefail
          npm run lint --if-present

      - name: Middleware unit tests
        working-directory: middleware
        run: |
          set -euo pipefail
          npm test

      - name: Middleware production build
        working-directory: middleware
        run: |
          set -euo pipefail
          npm run build --if-present

      - name: Middleware dependency audit
        working-directory: middleware
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

  chaincode-tests:
    name: Chaincode — Vet, Unit & Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: chaincode/go.mod
          cache: false

      - name: Download Go modules
        working-directory: chaincode
        run: |
          set -euo pipefail
          go mod download

      - name: Verify Go dependencies
        working-directory: chaincode
        run: |
          set -euo pipefail
          go mod verify

      - name: Go vet
        working-directory: chaincode
        run: |
          set -euo pipefail
          go vet ./...

      - name: Run chaincode unit and race tests
        working-directory: chaincode
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

  dotnet-tests:
    name: .NET — Build, Checks & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sectioning_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sectioning_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build ASP.NET services
        run: |
          set -euo pipefail
          dotnet restore client-app/For_Testing_Only_Capstone.csproj
          dotnet build client-app/For_Testing_Only_Capstone.csproj \
            --configuration Release \
            --no-restore \
            --verbosity minimal

      - name: Run repository .NET checks
        env:
          SECTIONING_TEST_CONNECTION: Host=localhost;Port=5432;Database=sectioning_tests;Username=postgres;Password=ci-only-postgres-password
        run: |
          set -euo pipefail

          projects=(
            tests/EnrollmentImportChecks/EnrollmentImportChecks.csproj
            tests/EnrollmentSectioningChecks/EnrollmentSectioningChecks.csproj
          )

          for project in "${projects[@]}"; do
            if [ ! -f "$project" ]; then
              echo "::error::Required check project is missing: $project"
              exit 1
            fi

            echo "Running $project"
            dotnet run \
              --project "$project" \
              --configuration Release
          done

      - name: Audit NuGet dependencies
        run: |
          set -euo pipefail
          report="dotnet-vulnerabilities.txt"

          dotnet list client-app/For_Testing_Only_Capstone.csproj package \
            --vulnerable \
            --include-transitive \
            > "$report"

          cat "$report"
          if grep -Eq '(^|[[:space:]])(High|Critical)([[:space:]]|$)' "$report"; then
            echo "::error::NuGet reported high or critical direct/transitive dependencies."
            exit 1
          fi

  security:
    name: DevSecOps Security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  infra-preflight:
    name: Infrastructure — K8s Failsafe Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - frontend-tests
      - middleware-tests
      - chaincode-tests
      - dotnet-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml

          VERSION="0.8.0"
          SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

          curl -fsSLo kubeconform.tar.gz             "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz"

          echo "${SHA256}  kubeconform.tar.gz" | sha256sum --check -
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz
          kubeconform -v

      - name: Parse Kubernetes YAML
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          root = Path("network/k8s")
          if not root.is_dir():
              raise SystemExit("network/k8s directory is missing.")

          files = sorted(
              p for p in root.rglob("*")
              if p.suffix.lower() in {".yaml", ".yml"}
          )

          if not files:
              raise SystemExit("No Kubernetes YAML manifests were found.")

          errors = []
          for path in files:
              try:
                  with path.open("r", encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              sys.exit(1)

          print(f"Parsed {len(files)} Kubernetes YAML file(s).")
          PY

      - name: Validate Kubernetes schemas offline
        run: |
          set -euo pipefail
          mapfile -d '' MANIFESTS < <(
            find network/k8s -type f               \( -name '*.yaml' -o -name '*.yml' \) -print0
          )

          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "::error::No Kubernetes YAML manifests were found."
            exit 1
          fi

          kubeconform             -strict             -summary             -ignore-missing-schemas             "${MANIFESTS[@]}"

      - name: Validate CouchDB JSON patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("network/k8s/couchdb-health-probe-json-patch.json")
          if not path.is_file():
              raise SystemExit(f"{path} is missing.")

          patch = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(patch, list):
              raise SystemExit("JSON patch must be an array.")

          allowed = {"add", "remove", "replace", "move", "copy", "test"}

          for i, operation in enumerate(patch):
              if not isinstance(operation, dict):
                  raise SystemExit(f"Patch operation {i} must be an object.")

              op = operation.get("op")
              pointer = operation.get("path")

              if op not in allowed:
                  raise SystemExit(f"Patch operation {i} has invalid op: {op!r}")

              if not isinstance(pointer, str) or not pointer.startswith("/"):
                  raise SystemExit(f"Patch operation {i} has invalid path.")

              if op in {"add", "replace", "test"} and "value" not in operation:
                  raise SystemExit(f"Patch operation {i} requires value.")

              if op in {"move", "copy"} and "from" not in operation:
                  raise SystemExit(f"Patch operation {i} requires from.")

          print(f"Valid JSON patch with {len(patch)} operation(s).")
          PY

      - name: Validate workload safety configuration
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          ROOT = Path("network/k8s")
          WORKLOADS = {"Deployment", "StatefulSet", "DaemonSet"}

          # Current application services are held to the strict CI baseline.
          # Older/stateful infrastructure is still inspected, but missing
          # hardening fields are reported as technical-debt notes so the
          # development gate does not fail on dozens of pre-existing items.
          STRICT_WORKLOADS = {
              "middleware-api",
              "auth-service",
              "fabric-identity-service",
              "ledger-service",
              "grade-upload-service",
              "settings-service",
              "dotnet-api-gateway",
              "dotnet-auth-service",
              "dotnet-academic-service",
              "dotnet-grade-service",
              "dotnet-operations-service",
              "dotnet-realtime-service",
              "frontend",
          }

          errors = []
          notes = []
          pdb_count = 0
          workload_count = 0
          strict_count = 0

          manifest_files = sorted(
              p for p in ROOT.rglob("*")
              if p.suffix.lower() in {".yaml", ".yml"}
          )

          if not manifest_files:
              raise SystemExit(
                  "No YAML Kubernetes manifests found under network/k8s"
              )

          def report_missing(strict, message):
              if strict:
                  errors.append(message)
              else:
                  notes.append(message)

          for path in manifest_files:
              try:
                  documents = list(
                      yaml.safe_load_all(
                          path.read_text(encoding="utf-8")
                      )
                  )
              except Exception as exc:
                  errors.append(
                      f"{path}: YAML parse failure: {exc}"
                  )
                  continue

              for index, document in enumerate(documents, start=1):
                  if not isinstance(document, dict):
                      continue

                  kind = document.get("kind")
                  metadata = document.get("metadata") or {}
                  name = metadata.get("name", f"document-{index}")
                  resource_id = (
                      f"{path}: {kind or 'Unknown'}/{name}"
                  )

                  if kind == "PodDisruptionBudget":
                      pdb_count += 1

                  if kind not in WORKLOADS:
                      continue

                  workload_count += 1
                  strict = name in STRICT_WORKLOADS

                  if strict:
                      strict_count += 1

                  template = (
                      document
                      .get("spec", {})
                      .get("template", {})
                  )
                  pod_spec = template.get("spec") or {}

                  # A workload with no container definition is always invalid.
                  containers = pod_spec.get("containers") or []
                  if not containers:
                      errors.append(
                          f"{resource_id}: no containers defined"
                      )
                      continue

                  # terminationGracePeriodSeconds:
                  # - strict apps: required
                  # - infrastructure: note if missing
                  # - any workload: invalid value is an error
                  grace = pod_spec.get(
                      "terminationGracePeriodSeconds"
                  )

                  if grace is None:
                      notes.append(
                          f"{resource_id}: missing "
                          "terminationGracePeriodSeconds"
                      )
                  elif not isinstance(grace, int) or grace <= 0:
                      errors.append(
                          f"{resource_id}: invalid "
                          "terminationGracePeriodSeconds "
                          f"value: {grace}"
                      )

                  for container in containers:
                      container_name = container.get(
                          "name",
                          "<unnamed>",
                      )
                      prefix = (
                          f"{resource_id}: "
                          f"container/{container_name}"
                      )

                      # Readiness/liveness are mandatory on the current
                      # application services. Existing Fabric/Postgres/
                      # CouchDB/IPFS/chaincode gaps remain visible as notes.
                      if not container.get("readinessProbe"):
                          report_missing(
                              strict,
                              f"{prefix}: missing readinessProbe",
                          )

                      if not container.get("livenessProbe"):
                          report_missing(
                              strict,
                              f"{prefix}: missing livenessProbe",
                          )

                      resources = container.get("resources") or {}
                      requests = resources.get("requests") or {}
                      limits = resources.get("limits") or {}

                      for resource in ("cpu", "memory"):
                          if resource not in requests:
                              report_missing(
                                  strict,
                                  f"{prefix}: missing "
                                  f"resources.requests.{resource}",
                              )

                          if resource not in limits:
                              report_missing(
                                  strict,
                                  f"{prefix}: missing "
                                  f"resources.limits.{resource}",
                              )

                      if (
                          kind == "StatefulSet"
                          and not container.get("startupProbe")
                      ):
                          notes.append(
                              f"{prefix}: no startupProbe"
                          )

          if workload_count == 0:
              errors.append(
                  "No Deployment, StatefulSet, or DaemonSet "
                  "resources were detected."
              )

          if strict_count == 0:
              errors.append(
                  "None of the current application workloads "
                  "were detected."
              )

          if pdb_count == 0:
              errors.append(
                  "No PodDisruptionBudget resources detected."
              )

          print()
          print("==========================================")
          print("Kubernetes workload validation")
          print("==========================================")
          print(f"Workloads checked:       {workload_count}")
          print(f"Strict app workloads:    {strict_count}")
          print(f"PDBs detected:           {pdb_count}")
          print(f"Technical-debt notes:    {len(notes)}")
          print()

          if notes:
              print("NON-BLOCKING NOTES:")
              for note in notes:
                  print(f"  - {note}")
              print()

          if errors:
              print("BLOCKING ERRORS:")
              for error in errors:
                  print(f"  - {error}")

              print()
              print(
                  f"Validation failed with "
                  f"{len(errors)} blocking error(s)."
              )
              sys.exit(1)

          print(
              "Kubernetes failsafe checks passed. "
              "Legacy infrastructure debt remains visible above "
              "but does not block the development CI gate."
          )
          PY

      - name: Validate deploy-k8s.sh
        run: |
          set -euo pipefail
          SCRIPT="network/k8s/deploy-k8s.sh"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing."
            exit 1
          fi

          bash -n "$SCRIPT"
          shellcheck --severity=warning "$SCRIPT"

      - name: Run offline infrastructure verification
        env:
          FABRIC_BOOTSTRAP: "false"
          KUBECTL_REMOTE_COMMAND_WEBSOCKETS: "false"
        run: |
          set -euo pipefail
          bash network/k8s/deploy-k8s.sh local verify

  ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - frontend-tests
      - middleware-tests
      - chaincode-tests
      - dotnet-tests
      - security
      - infra-preflight
    steps:
      - name: Evaluate all required CI jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          MIDDLEWARE_RESULT: ${{ needs.middleware-tests.result }}
          CHAINCODE_RESULT: ${{ needs.chaincode-tests.result }}
          DOTNET_RESULT: ${{ needs.dotnet-tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          INFRA_RESULT: ${{ needs.infra-preflight.result }}
        run: |
          set -euo pipefail
          FAILED=0

          check_result() {
            local name="$1"
            local result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::$name result: $result"
              FAILED=1
            else
              echo "PASS: $name"
            fi
          }

          check_result "Frontend" "$FRONTEND_RESULT"
          check_result "Middleware" "$MIDDLEWARE_RESULT"
          check_result "Chaincode" "$CHAINCODE_RESULT"
          check_result ".NET" "$DOTNET_RESULT"
          check_result "DevSecOps security" "$SECURITY_RESULT"
          check_result "Infrastructure" "$INFRA_RESULT"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Develop-and-Integration CI gate FAILED."
            exit 1
          fi

          echo "=========================================="
          echo "DEVELOP-AND-INTEGRATION QUALITY GATE PASSED"
          echo "=========================================="

  validate-promotion-token:
    name: Validate Promotion Token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - ci-gate
    if: >-
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/Develop-and-Integration'
      )
      ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/Develop-and-Integration' &&
        inputs.promote == true
      )
    env:
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
    steps:
      - name: Verify PROMOTION_TOKEN
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROMOTION_TOKEN is not configured."
            exit 1
          fi

          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y gh
          fi

          gh api "repos/${GITHUB_REPOSITORY}" >/dev/null
          echo "PROMOTION_TOKEN can access repository."

  promote:
    name: Promote → Feature/API Endpoint Testing
    needs:
      - validate-promotion-token
    if: >-
      success() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/Develop-and-Integration'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/Develop-and-Integration' &&
          inputs.promote == true
        )
      )
    permissions:
      contents: read
    uses: ./.github/workflows/promote.yml
    with:
      source_branch: Develop-and-Integration
      target_branch: feature/api-endpoints-Testing
      tested_sha: ${{ github.sha }}
    secrets:
      PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}