name: Develop-and-Integration — XP TDD/CI (fast)

on:
  push:
    branches: [Develop-and-Integration]
  pull_request:
    branches: [Develop-and-Integration]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  setup:
    name: Checkout & Setup toolchain
    runs-on: ubuntu-latest
    outputs:
      node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            middleware/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Go
        uses: actions/setup-go@v