name: Develop-and-Integration — XP TDD/CI (failsafe)

on:
  push:
    branches:
      - Develop-and-Integration

  pull_request:
    branches:
      - Develop-and-Integration

  workflow_dispatch:
    inputs:
      promote:
        description: "Promote to feature/api-endpoints-Testing after all checks pass"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dev-ci-failsafe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

defaults:
  run:
    shell: bash

jobs:

  frontend-tests:
    name: Frontend — Lint, Unit, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false

      - name: Frontend lint
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test -- --watchAll=false

      - name: Frontend production build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          set -euo pipefail

          # Fail CI for HIGH or CRITICAL vulnerabilities
          # in production dependencies.
          npm audit \
            --omit=dev \
            --audit-level=high

  middleware-tests:
    name: Middleware — Lint, Unit, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: middleware/package-lock.json

      - name: Install middleware dependencies
        working-directory: middleware
        run: |
          set -euo pipefail
          npm ci --no-audit --fund=false

      - name: Middleware lint
        working-directory: middleware
        run: |
          set -euo pipefail
          npm run lint

      - name: Middleware unit tests
        working-directory: middleware
        run: |
          set -euo pipefail
          npm test

      - name: Middleware production build
        working-directory: middleware
        run: |
          set -euo pipefail

          # Runs if middleware has a build script.
          npm run build --if-present

      - name: Middleware dependency audit
        working-directory: middleware
        run: |
          set -euo pipefail

          npm audit \
            --omit=dev \
            --audit-level=high

  chaincode-tests:
    name: Chaincode — Vet, Unit & Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chaincode/go.mod
          cache: true

      - name: Download Go modules
        working-directory: chaincode
        run: |
          set -euo pipefail
          go mod download

      - name: Verify Go dependencies
        working-directory: chaincode
        run: |
          set -euo pipefail
          go mod verify

      - name: Go vet
        working-directory: chaincode
        run: |
          set -euo pipefail
          go vet ./...

      - name: Run chaincode unit tests
        working-directory: chaincode
        run: |
          set -euo pipefail

          # -race:
          # Detect race conditions.
          #
          # -count=1:
          # Prevent cached test results from hiding a failure.
          go test \
            -race \
            -count=1 \
            ./...

  dotnet-tests:
    name: .NET — Enrollment Import Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run .NET tests if present
        run: |
          set -euo pipefail

          PROJECT="tests/EnrollmentImportChecks/EnrollmentImportChecks.csproj"

          if [ -f "$PROJECT" ]; then
            echo "Running .NET test project: $PROJECT"

            dotnet test "$PROJECT" \
              --configuration Release \
              --verbosity minimal
          else
            echo "No EnrollmentImportChecks project found."
            echo "Skipping optional .NET tests."
          fi

  infra-preflight:
    name: Infrastructure — K8s Failsafe Preflight
    runs-on: ubuntu-latest

    needs:
      - frontend-tests
      - middleware-tests
      - chaincode-tests
      - dotnet-tests

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          set -euo pipefail

          sudo apt-get update -y

          sudo apt-get install -y \
            shellcheck \
            python3-yaml


      - name: Ensure kubectl is available
        run: |
          set -euo pipefail

          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
            exit 0
          fi

          echo "kubectl not found. Installing verified stable release."

          VERSION="$(curl -fsSL \
            https://dl.k8s.io/release/stable.txt)"

          curl -fsSLO \
            "https://dl.k8s.io/release/${VERSION}/bin/linux/amd64/kubectl"

          curl -fsSLO \
            "https://dl.k8s.io/release/${VERSION}/bin/linux/amd64/kubectl.sha256"

          echo "$(cat kubectl.sha256)  kubectl" \
            | sha256sum --check

          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          kubectl version --client

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail

          if [ ! -d network/k8s ]; then
            echo "::error::network/k8s directory is missing."
            exit 1
          fi

          # Recursive so manifests inside subdirectories
          # are also checked.
          kubectl apply \
            --dry-run=client \
            --recursive \
            -f network/k8s/

      - name: Validate workload safety configuration
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys
          import yaml

          ROOT = Path("network/k8s")

          WORKLOADS = {
              "Deployment",
              "StatefulSet",
              "DaemonSet",
          }

          errors = []
          warnings = []
          pdb_count = 0
          workload_count = 0

          manifest_files = sorted(
              [
                  p for p in ROOT.rglob("*")
                  if p.suffix.lower() in {".yaml", ".yml"}
              ]
          )

          if not manifest_files:
              errors.append(
                  "No YAML Kubernetes manifests found under network/k8s"
              )

          for path in manifest_files:

              try:
                  documents = list(
                      yaml.safe_load_all(
                          path.read_text(
                              encoding="utf-8"
                          )
                      )
                  )
              except Exception as exc:
                  errors.append(
                      f"{path}: YAML parse failure: {exc}"
                  )
                  continue

              for index, document in enumerate(documents, start=1):

                  if not isinstance(document, dict):
                      continue

                  kind = document.get("kind")
                  metadata = document.get("metadata") or {}

                  name = metadata.get(
                      "name",
                      f"document-{index}",
                  )

                  resource_id = (
                      f"{path}: "
                      f"{kind or 'Unknown'}/{name}"
                  )

                  if kind == "PodDisruptionBudget":
                      pdb_count += 1

                  if kind not in WORKLOADS:
                      continue

                  workload_count += 1

                  template = (
                      document
                      .get("spec", {})
                      .get("template", {})
                  )

                  pod_spec = (
                      template.get("spec") or {}
                  )

                  # ------------------------------------------
                  # Graceful termination
                  # ------------------------------------------

                  grace = pod_spec.get(
                      "terminationGracePeriodSeconds"
                  )

                  if grace is None:
                      errors.append(
                          f"{resource_id}: missing "
                          "terminationGracePeriodSeconds"
                      )

                  elif not isinstance(grace, int) or grace <= 0:
                      errors.append(
                          f"{resource_id}: invalid "
                          "terminationGracePeriodSeconds "
                          f"value: {grace}"
                      )

                  # ------------------------------------------
                  # Containers
                  # ------------------------------------------

                  containers = pod_spec.get(
                      "containers"
                  ) or []

                  if not containers:
                      errors.append(
                          f"{resource_id}: no containers defined"
                      )
                      continue

                  for container in containers:

                      container_name = container.get(
                          "name",
                          "<unnamed>",
                      )

                      prefix = (
                          f"{resource_id}: "
                          f"container/{container_name}"
                      )

                      # Readiness
                      if not container.get(
                          "readinessProbe"
                      ):
                          errors.append(
                              f"{prefix}: "
                              "missing readinessProbe"
                          )

                      # Liveness
                      if not container.get(
                          "livenessProbe"
                      ):
                          errors.append(
                              f"{prefix}: "
                              "missing livenessProbe"
                          )

                      # Resource controls
                      resources = (
                          container.get("resources") or {}
                      )

                      requests = (
                          resources.get("requests") or {}
                      )

                      limits = (
                          resources.get("limits") or {}
                      )

                      for resource in ("cpu", "memory"):

                          if resource not in requests:
                              errors.append(
                                  f"{prefix}: "
                                  f"missing resources.requests."
                                  f"{resource}"
                              )

                          if resource not in limits:
                              errors.append(
                                  f"{prefix}: "
                                  f"missing resources.limits."
                                  f"{resource}"
                              )

                      # Startup probe is especially useful for
                      # stateful components, but don't make it
                      # mandatory for every workload.
                      if (
                          kind == "StatefulSet"
                          and not container.get("startupProbe")
                      ):
                          warnings.append(
                              f"{prefix}: no startupProbe. "
                              "Consider adding one for slow "
                              "starting stateful services."
                          )

          if workload_count == 0:
              errors.append(
                  "No Deployment, StatefulSet, or DaemonSet "
                  "resources were detected."
              )

          if pdb_count == 0:
              errors.append(
                  "No PodDisruptionBudget resources detected."
              )

          print()
          print("==========================================")
          print("Kubernetes workload validation")
          print("==========================================")
          print(f"Workloads checked: {workload_count}")
          print(f"PDBs detected:     {pdb_count}")
          print()

          if warnings:
              print("WARNINGS:")
              for warning in warnings:
                  print(f"  - {warning}")
              print()

          if errors:
              print("ERRORS:")
              for error in errors:
                  print(f"  - {error}")

              print()
              print(
                  f"Validation failed with "
                  f"{len(errors)} error(s)."
              )

              sys.exit(1)

          print(
              "All Kubernetes workload "
              "failsafe checks passed."
          )

          PY

      - name: Validate deploy-k8s.sh
        run: |
          set -euo pipefail

          SCRIPT="network/k8s/deploy-k8s.sh"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing."
            exit 1
          fi

          echo "Checking Bash syntax..."
          bash -n "$SCRIPT"

          echo "Running ShellCheck..."
          shellcheck \
            --severity=warning \
            "$SCRIPT"


      # ------------------------------------------------------
      # NON-DESTRUCTIVE VERIFY
      # ------------------------------------------------------

      - name: Run local infrastructure verification
        env:
          FABRIC_BOOTSTRAP: "false"
          KUBECTL_REMOTE_COMMAND_WEBSOCKETS: "false"
        run: |
          set -euo pipefail

          bash network/k8s/deploy-k8s.sh \
            local \
            verify

  ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest

    if: always()

    needs:
      - frontend-tests
      - middleware-tests
      - chaincode-tests
      - dotnet-tests
      - infra-preflight

    timeout-minutes: 5

    steps:
      - name: Evaluate all required CI jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          MIDDLEWARE_RESULT: ${{ needs.middleware-tests.result }}
          CHAINCODE_RESULT: ${{ needs.chaincode-tests.result }}
          DOTNET_RESULT: ${{ needs.dotnet-tests.result }}
          INFRA_RESULT: ${{ needs.infra-preflight.result }}
        run: |
          set -euo pipefail

          FAILED=0

          check_result() {
            local name="$1"
            local result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::$name result: $result"
              FAILED=1
            else
              echo "PASS: $name"
            fi
          }

          check_result \
            "Frontend" \
            "$FRONTEND_RESULT"

          check_result \
            "Middleware" \
            "$MIDDLEWARE_RESULT"

          check_result \
            "Chaincode" \
            "$CHAINCODE_RESULT"

          check_result \
            ".NET" \
            "$DOTNET_RESULT"

          check_result \
            "Infrastructure" \
            "$INFRA_RESULT"

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "::error::Develop-and-Integration CI gate FAILED."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "DEVELOP-AND-INTEGRATION QUALITY GATE PASSED"
          echo "=========================================="
          echo
          echo "All required XP/TDD/CI checks passed."============================================================

  validate-promotion-token:
    name: Validate Promotion Token

    runs-on: ubuntu-latest

    needs:
      - ci-gate

    if: >-
      ${{
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/Develop-and-Integration'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/Develop-and-Integration' &&
          inputs.promote == true
        )
      }}

    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}

    steps:
      - name: Verify PROMOTION_TOKEN
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then

            echo "::error::PROMOTION_TOKEN is not configured."

            echo "::error::Create it under:"
            echo "::error::Repository Settings -> Secrets and variables -> Actions"

            exit 1
          fi

          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing GitHub CLI..."

            sudo apt-get update -y
            sudo apt-get install -y gh
          fi

          gh --version

          # Uses GH_TOKEN directly.
          # No gh auth login and no token written to
          # a persistent credential configuration.
          gh api \
            "repos/${GITHUB_REPOSITORY}" \
            >/dev/null

          echo "PROMOTION_TOKEN can access repository."
          
promote:
  name: Promote → Feature/API Endpoint Testing

  needs:
    - validate-promotion-token

  if: >-
    success() &&
    github.actor != 'github-actions[bot]' &&
    (
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/Develop-and-Integration'
      )
      ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/Develop-and-Integration' &&
        inputs.promote == true
      )
    )

  permissions:
    contents: read

  uses: ./.github/workflows/promote.yml

  with:
    source_branch: Develop-and-Integration
    target_branch: feature/api-endpoints-Testing
    tested_sha: ${{ github.sha }}

  secrets:
    PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}