---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: plv-fabric
data:
  default.conf: |-
    upstream client_app {
      server client-app-service.plv-fabric.svc.cluster.local:5000;
      keepalive 16;
    }

    upstream middleware_api {
      server middleware-api.plv-fabric.svc.cluster.local:4000;
      keepalive 16;
    }

    upstream ipfs_gateway {
      server ipfs-ha-gateway.plv-fabric.svc.cluster.local:8080;
      keepalive 8;
    }

    upstream ipfs_api {
      server ipfs-ha-api.plv-fabric.svc.cluster.local:5001;
      keepalive 8;
    }

    server {
      listen 80;
      server_name _;
      client_max_body_size 100m;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;

      location = /nginx-health {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
      }

      location /chatHub {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://client_app;
      }

      location ^~ /api/chatHub {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://client_app;
      }

      location /ipfs/ {
        proxy_pass http://ipfs_gateway;
      }

      location /ipfs-webui/ {
        proxy_set_header Host localhost:5001;
        proxy_set_header Origin "";
        rewrite ^/ipfs-webui/(.*) /webui/$1 break;
        proxy_pass http://ipfs_api;
      }

      location /api/v0/ {
        proxy_set_header Host localhost:5001;
        proxy_set_header Origin "";
        proxy_pass http://ipfs_api;
      }

      location ^~ /api/Grades { proxy_pass http://client_app; }
      location ^~ /api/Student { proxy_pass http://client_app; }
      location ^~ /api/student { proxy_pass http://client_app; }
      location ^~ /api/GradeTemplate { proxy_pass http://client_app; }
      location ^~ /api/SystemSettings { proxy_pass http://client_app; }
      location ^~ /api/SystemMonitoring { proxy_pass http://client_app; }
      location ^~ /api/BulkUpload { proxy_pass http://client_app; }
      location ^~ /api/RegistrarDashboard { proxy_pass http://client_app; }
      location ^~ /api/Sectioning { proxy_pass http://client_app; }
      location ^~ /api/AccountManagement { proxy_pass http://client_app; }
      location ^~ /api/Curriculums { proxy_pass http://client_app; }
      location ^~ /api/SupportTickets { proxy_pass http://client_app; }
      location ^~ /api/backend/health { proxy_pass http://client_app; }
      location ^~ /api/Auth { proxy_pass http://client_app; }
      location ^~ /api/registrar/ { proxy_pass http://client_app; }

      location /api/ {
        proxy_pass http://middleware_api;
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: plv-fabric
  labels:
    app: frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend-nginx
        image: registry.example.com/plv-repo/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        livenessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: plv-fabric
  labels:
    app: frontend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
