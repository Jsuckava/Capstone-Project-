---
# Secrets are created from network/.env by deploy-k8s.sh.
# Do not put JWT keys, API keys, database passwords, CA bootstrap passwords,
# email credentials, or chaincode package IDs in this manifest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fabric-config
  namespace: plv-fabric
data:
  FABRIC_NETWORK_NAME: "plv-blockgo-network"
  FABRIC_CHANNEL_NAME: "registrar-channel"
  FABRIC_CHAINCODE_NAME: "registrar"
  FABRIC_ORDERER_URL: "grpcs://orderer-1.plv-main-campus.svc.cluster.local:7050"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fabric-config
  namespace: plv-main-campus
data:
  FABRIC_NETWORK_NAME: "plv-blockgo-network"
  FABRIC_CHANNEL_NAME: "registrar-channel"
  FABRIC_CHAINCODE_NAME: "registrar"
  FABRIC_MSP_ID: "RegistrarMSP"
  FABRIC_PEER_ENDPOINT: "peer0.registrar.capstone.com:7051"
  FABRIC_CA_URL: "https://ca-registrar.plv-main-campus.svc.cluster.local:7054"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: plv-main-campus
data:
  POSTGRES_DB: "ActivityLogs"
  POSTGRES_HOST: "postgres.plv-main-campus.svc.cluster.local"
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipfs-config
  namespace: plv-fabric
data:
  IPFS_PROFILE: "server"
  IPFS_SWARM_KEY_FILE: "/etc/ipfs/swarm.key"
