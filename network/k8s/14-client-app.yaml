---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dotnet-service-config
  namespace: plv-fabric
data:
  POSTGRES_HOST: postgres.plv-main-campus.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ActivityLogs
  REDIS_CONNECTION_STRING: redis-master.plv-fabric.svc.cluster.local:6379
  MIDDLEWARE_URL: http://middleware-api.plv-fabric.svc.cluster.local:4000
  Middleware__Url: http://middleware-api.plv-fabric.svc.cluster.local:4000
  IPFS_HOST: ipfs-ha-gateway.plv-fabric.svc.cluster.local
  IpfsApiUrl: http://ipfs-ha-api.plv-fabric.svc.cluster.local:5001/api/v0/add?cid-version=1&wrap-with-directory=false
  IpfsUrl: http://ipfs-ha-api.plv-fabric.svc.cluster.local:5001
  IpfsGatewayUrl: http://ipfs-ha-gateway.plv-fabric.svc.cluster.local:8080
  IPFS_PEER_NODES: ipfs-api.plv-fabric.svc.cluster.local,ipfs-annex-api.plv-annex-campus.svc.cluster.local,ipfs-pubad-api.plv-pubad-campus.svc.cluster.local
  Monitoring__FrontendUrl: http://frontend-service.plv-fabric.svc.cluster.local
  Monitoring__MiddlewareUrl: http://middleware-api.plv-fabric.svc.cluster.local:4000
  Monitoring__PrometheusUrl: http://prometheus.plv-fabric.svc.cluster.local:9090
  Monitoring__GrafanaUrl: http://grafana.plv-fabric.svc.cluster.local:3000
  PROMETHEUS_URL: http://prometheus.plv-fabric.svc.cluster.local:9090
  GRAFANA_URL: http://grafana.plv-fabric.svc.cluster.local:3000
  DOTNET_AUTH_SERVICE_URL: http://dotnet-auth-service.plv-fabric.svc.cluster.local:5101
  DOTNET_ACADEMIC_SERVICE_URL: http://dotnet-academic-service.plv-fabric.svc.cluster.local:5102
  DOTNET_GRADE_SERVICE_URL: http://dotnet-grade-service.plv-fabric.svc.cluster.local:5103
  DOTNET_OPERATIONS_SERVICE_URL: http://dotnet-operations-service.plv-fabric.svc.cluster.local:5104
  DOTNET_REALTIME_SERVICE_URL: http://dotnet-realtime-service.plv-fabric.svc.cluster.local:5105
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-api-gateway
  namespace: plv-fabric
  labels: { app: dotnet-api-gateway, tier: application, runtime: dotnet }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dotnet-api-gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: dotnet-api-gateway, tier: application, runtime: dotnet }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
      - name: dotnet-api-gateway
        image: registry.example.com/plv-repo/client-app:latest
        imagePullPolicy: Always
        ports: [{ name: http, containerPort: 5000 }]
        envFrom:
        - configMapRef: { name: dotnet-service-config }
        env:
        - { name: DOTNET_SERVICE_NAME, value: gateway }
        - { name: DOTNET_SERVICE_PORT, value: "5000" }
        - { name: ASPNETCORE_URLS, value: "http://+:5000" }
        startupProbe:
          httpGet: { path: /health, port: 5000 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /api/ready, port: 5000 }
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /health, port: 5000 }
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: { memory: 64Mi, cpu: 50m }
          limits: { memory: 192Mi, cpu: 300m }
---
apiVersion: v1
kind: Service
metadata:
  name: client-app-service
  namespace: plv-fabric
  labels: { app: dotnet-api-gateway, compatibility: client-app }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector: { app: dotnet-api-gateway }
  ports: [{ name: http, protocol: TCP, port: 5000, targetPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-api-gateway
  namespace: plv-fabric
  labels: { app: dotnet-api-gateway }
spec:
  selector: { app: dotnet-api-gateway }
  ports: [{ name: http, protocol: TCP, port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-auth-service
  namespace: plv-fabric
  labels: { app: dotnet-auth-service, tier: application, runtime: dotnet }
spec:
  replicas: 2
  selector:
    matchLabels: { app: dotnet-auth-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: dotnet-auth-service, tier: application, runtime: dotnet }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
      - name: dotnet-auth-service
        image: registry.example.com/plv-repo/client-app:latest
        imagePullPolicy: Always
        ports: [{ name: http, containerPort: 5101 }]
        envFrom:
        - configMapRef: { name: dotnet-service-config }
        - secretRef: { name: blockgo-secrets }
        env:
        - { name: DOTNET_SERVICE_NAME, value: auth }
        - { name: DOTNET_SERVICE_PORT, value: "5101" }
        - { name: ASPNETCORE_URLS, value: "http://+:5101" }
        startupProbe: &auth-startup
          httpGet: { path: /health, port: 5101 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe: &auth-ready
          httpGet: { path: /api/ready, port: 5101 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe: *auth-startup
        resources:
          requests: { memory: 128Mi, cpu: 75m }
          limits: { memory: 384Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-auth-service
  namespace: plv-fabric
  labels: { app: dotnet-auth-service }
spec:
  selector: { app: dotnet-auth-service }
  ports: [{ name: http, port: 5101, targetPort: 5101 }]
