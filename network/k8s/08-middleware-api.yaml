        - name: IPFS_ENCRYPTION_KEY
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: IPFS_ENCRYPTION_KEY } }
        volumeMounts: [{ name: uploads, mountPath: /app/uploads }]
        startupProbe: &upload-health
          httpGet: { path: /api/health, port: 4004 }
