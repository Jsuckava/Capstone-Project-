---
apiVersion: v1
kind: ConfigMap
metadata:
  name: middleware-service-config
  namespace: plv-fabric
data:
  NODE_ENV: production
  AUTH_SERVICE_URL: http://auth-service.plv-fabric.svc.cluster.local:4001
  IDENTITY_SERVICE_URL: http://fabric-identity-service.plv-fabric.svc.cluster.local:4002
  LEDGER_SERVICE_URL: http://ledger-service.plv-fabric.svc.cluster.local:4003
  UPLOAD_SERVICE_URL: http://grade-upload-service.plv-fabric.svc.cluster.local:4004
  SETTINGS_SERVICE_URL: http://settings-service.plv-fabric.svc.cluster.local:4005
  CSHARP_API_URL: http://client-app-service.plv-fabric.svc.cluster.local:5000
  IPFS_API_URL: /dns4/ipfs-ha-api.plv-fabric.svc.cluster.local/tcp/5001/http
  POSTGRES_DB: ActivityLogs
  POSTGRES_HOST: postgres.plv-main-campus.svc.cluster.local
  POSTGRES_PORT: "5432"
  CHANNEL_NAME: registrar-channel
  CHAINCODE_NAME: registrar
  COUCHDB_WALLET_REGISTRAR_URL: http://couchdb-wallet-registrar.plv-main-campus.svc.cluster.local:5985
  COUCHDB_WALLET_FACULTY_URL: http://couchdb-wallet-faculty.plv-annex-campus.svc.cluster.local:5985
  COUCHDB_WALLET_DEPARTMENT_URL: http://couchdb-wallet-department.plv-pubad-campus.svc.cluster.local:5985
  FABRIC_CA_REGISTRAR_URL: https://ca-registrar.plv-main-campus.svc.cluster.local:7054
  FABRIC_CA_FACULTY_URL: https://ca-faculty.plv-annex-campus.svc.cluster.local:7054
  FABRIC_CA_DEPARTMENT_URL: https://ca-department.plv-pubad-campus.svc.cluster.local:7054
  FABRIC_CA_REGISTRAR_CERT: /etc/hyperledger/fabric-ca-roots/registrar-ca-cert.pem
  FABRIC_CA_REGISTRAR_TLS_CERT: /etc/hyperledger/fabric-ca-roots/registrar-tls-cert.pem
  FABRIC_CA_FACULTY_CERT: /etc/hyperledger/fabric-ca-roots/faculty-ca-cert.pem
  FABRIC_CA_FACULTY_TLS_CERT: /etc/hyperledger/fabric-ca-roots/faculty-tls-cert.pem
  FABRIC_CA_DEPARTMENT_CERT: /etc/hyperledger/fabric-ca-roots/department-ca-cert.pem
  FABRIC_CA_DEPARTMENT_TLS_CERT: /etc/hyperledger/fabric-ca-roots/department-tls-cert.pem
  FABRIC_CA_INSECURE_TLS: "false"
  FABRIC_GATEWAY_TLS_ROOTS: /etc/hyperledger/fabric-gateway-tls
  FABRIC_DISCOVERY_ENABLED: "true"
  FABRIC_HA_ENABLED: "true"
  FABRIC_PEER_REGISTRAR_2_URL: grpcs://peer-registrar-2.plv-main-campus.svc.cluster.local:7051
  FABRIC_PEER_FACULTY_2_URL: grpcs://peer-faculty-2.plv-annex-campus.svc.cluster.local:7051
  FABRIC_PEER_DEPARTMENT_2_URL: grpcs://peer-department-2.plv-pubad-campus.svc.cluster.local:7051
  FABRIC_ORDERER_2_URL: grpcs://orderer-2.plv-main-campus.svc.cluster.local:7050
  FABRIC_ORDERER_3_URL: grpcs://orderer-3.plv-annex-campus.svc.cluster.local:7050
  FABRIC_ORDERER_4_URL: grpcs://orderer-4.plv-annex-campus.svc.cluster.local:7050
  FABRIC_ORDERER_5_URL: grpcs://orderer-5.plv-pubad-campus.svc.cluster.local:7050
  FABRIC_ORDERER_6_URL: grpcs://orderer-6.plv-pubad-campus.svc.cluster.local:7050
  CONNECTION_PROFILE_PATH: /app/connection.json
  GATEWAY_CACHE_MAX_USERS: "500"
  GATEWAY_IDLE_TIMEOUT_MS: "300000"
  GATEWAY_PRUNE_INTERVAL_MS: "60000"
  SHUTDOWN_GRACE_MS: "30000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: middleware-api
  namespace: plv-fabric
spec:
  replicas: 3
  selector:
    matchLabels: { app: middleware-api, tier: application }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: middleware-api, tier: application }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "4000"
    spec:
      terminationGracePeriodSeconds: 35
      containers:
      - name: api-gateway
        image: registry.example.com/plv-repo/fabric-middleware:latest
        imagePullPolicy: Always
        command: ["npm", "run", "start:gateway"]
        ports: [{ name: api, containerPort: 4000 }]
        envFrom: [{ configMapRef: { name: middleware-service-config } }]
        env:
        - { name: PORT, value: "4000" }
        - { name: NODE_OPTIONS, value: "--max-old-space-size=160" }
        - name: FRONTEND_URL
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: FRONTEND_URL, optional: true } }
        - name: CORS_ORIGINS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: CORS_ORIGINS, optional: true } }
        startupProbe: &gateway-health
          httpGet: { path: /api/health, port: 4000 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe: *gateway-health
        readinessProbe:
          httpGet: { path: /api/ready, port: 4000 }
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 3
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 192Mi, cpu: 300m }
---
apiVersion: v1
kind: Service
metadata:
  name: middleware-api
  namespace: plv-fabric
  labels: { app: middleware-api }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector: { app: middleware-api }
  ports: [{ name: api, port: 4000, targetPort: 4000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: middleware
  namespace: plv-fabric
spec:
  selector: { app: middleware-api }
  ports: [{ name: api, port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: plv-fabric
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service, tier: application }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: auth-service, tier: application }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "4001" }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
      - name: auth-service
        image: registry.example.com/plv-repo/fabric-middleware:latest
        imagePullPolicy: Always
        command: ["npm", "run", "start:auth"]
        ports: [{ name: api, containerPort: 4001 }]
        envFrom:
        - configMapRef: { name: middleware-service-config }
        env:
        - { name: PORT, value: "4001" }
        - { name: NODE_OPTIONS, value: "--max-old-space-size=192" }
        - name: JWT_SECRET
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: JWT_SECRET } }
        - name: INTERNAL_API_KEY
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: INTERNAL_API_KEY } }
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: POSTGRES_USER } }
        - name: POSTGRES_PASS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: POSTGRES_PASS } }
        - name: BOOTSTRAP_REGISTRAR_PASS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: BOOTSTRAP_REGISTRAR_PASS } }
        - name: BOOTSTRAP_SYSTEM_ADMIN_PASS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: BOOTSTRAP_SYSTEM_ADMIN_PASS } }
        - name: FRONTEND_URL
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: FRONTEND_URL, optional: true } }
        - name: EMAIL_USER
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: EMAIL_USER, optional: true } }
        - name: EMAIL_PASS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: EMAIL_PASS, optional: true } }
        startupProbe: &auth-health
          httpGet: { path: /api/health, port: 4001 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe: *auth-health
        readinessProbe:
          httpGet: { path: /api/ready, port: 4001 }
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 256Mi, cpu: 400m }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: plv-fabric
  labels: { app: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ name: api, port: 4001, targetPort: 4001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-identity-service
  namespace: plv-fabric
spec:
  replicas: 2
  selector:
    matchLabels: { app: fabric-identity-service, tier: application }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: fabric-identity-service, tier: application }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "4002" }
    spec:
      serviceAccountName: fabric-sa
      terminationGracePeriodSeconds: 40
      initContainers:
      - name: wait-for-wallets
        image: busybox:1.36.1
        command: ["/bin/sh", "-ec", "for e in couchdb-wallet-registrar.plv-main-campus.svc.cluster.local:5985 couchdb-wallet-faculty.plv-annex-campus.svc.cluster.local:5985 couchdb-wallet-department.plv-pubad-campus.svc.cluster.local:5985; do until nc -w 2 ${e%:*} ${e##*:} </dev/null; do sleep 2; done; done"]
      containers:
      - name: identity-service
        image: registry.example.com/plv-repo/fabric-middleware:latest
        imagePullPolicy: Always
        command: ["npm", "run", "start:identity"]
        ports: [{ name: api, containerPort: 4002 }]
        envFrom:
        - configMapRef: { name: middleware-service-config }
        env:
        - { name: PORT, value: "4002" }
        - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
        - name: INTERNAL_API_KEY
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: INTERNAL_API_KEY } }
        - name: COUCHDB_USER
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: COUCHDB_USER } }
        - name: COUCHDB_PASS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: COUCHDB_PASS } }
        - name: WALLET_ENCRYPTION_KEY
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: WALLET_ENCRYPTION_KEY, optional: true } }
        - name: BOOTSTRAP_REGISTRAR_PASS
          valueFrom: { secretKeyRef: { name: blockgo-secrets, key: BOOTSTRAP_REGISTRAR_PASS } }
        volumeMounts:
        - { name: fabric-ca-roots, mountPath: /etc/hyperledger/fabric-ca-roots, readOnly: true }
        startupProbe: &identity-health
          httpGet: { path: /api/health, port: 4002 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe: *identity-health
        readinessProbe:
          httpGet: { path: /api/ready, port: 4002 }
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests: { memory: 192Mi, cpu: 100m }
          limits: { memory: 384Mi, cpu: 500m }
      volumes:
      - name: fabric-ca-roots
        secret: { secretName: fabric-ca-roots }
---
apiVersion: v1
kind: Service
metadata:
  name: fabric-identity-service
  namespace: plv-fabric
  labels: { app: fabric-identity-service }
spec:
  selector: { app: fabric-identity-service }
  ports: [{ name: api, port: 4002, targetPort: 4002 }]
---
