        livenessProbe:
          httpGet:
            path: /_up
            port: 5984
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_up
            port: 5984
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: couchdb-single-node-config
        configMap:
          name: couchdb-single-node-config
      - name: couchdb-local-config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: couchdb-wallet-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb-wallet-department
  namespace: plv-pubad-campus
spec:
  selector:
    app: couchdb-wallet-department
  ports:
  - port: 5985
    targetPort: 5984
    name: couchdb
