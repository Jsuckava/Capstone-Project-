---
# Fabric Orderer 3 (Annex Campus)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orderer-3-pvc
  namespace: plv-annex-campus
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: fabric-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderer-3
  namespace: plv-annex-campus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: orderer-3
  template:
    metadata:
      labels:
        app: orderer-3
        org: orderer
    spec:
      serviceAccountName: orderer-sa
      nodeSelector:
        topology.kubernetes.io/zone: "__GKE_ZONE_C__"
      containers:
      - name: orderer
        image: hyperledger/fabric-orderer:2.5.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7050
          name: orderer
        - containerPort: 7051
          name: metrics
        - containerPort: 9443
          name: operations
        env:
        - name: FABRIC_CFG_PATH
          value: /etc/hyperledger/fabric
        - name: ORDERER_GENERAL_LISTENADDRESS
          value: "0.0.0.0"
        - name: ORDERER_GENERAL_LISTENPORT
          value: "7050"
        - name: ORDERER_METRICS_PROVIDER
          value: prometheus
        - name: ORDERER_OPERATIONS_LISTENADDRESS
          value: 0.0.0.0:9443
        - name: ORDERER_GENERAL_BOOTSTRAPMETHOD
          value: none
        - name: ORDERER_GENERAL_LOCALMSPID
          value: OrdererMSP
        - name: ORDERER_GENERAL_LOCALMSPDIR
          value: /var/hyperledger/orderer/msp
        - name: ORDERER_GENERAL_TLS_ENABLED
          value: "true"
        - name: ORDERER_GENERAL_TLS_PRIVATEKEY
          value: /var/hyperledger/orderer/tls/server.key
        - name: ORDERER_GENERAL_TLS_CERTIFICATE
          value: /var/hyperledger/orderer/tls/server.crt
        - name: ORDERER_GENERAL_TLS_ROOTCAS
          value: "[/var/hyperledger/orderer/tls/ca.crt]"
        - name: ORDERER_ADMIN_TLS_CLIENTROOTCAS
          value: "[/var/hyperledger/orderer/tls/ca.crt]"
        - name: ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE
          value: /var/hyperledger/orderer/tls/server.crt
        - name: ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY
          value: /var/hyperledger/orderer/tls/server.key
        - name: ORDERER_GENERAL_CLUSTER_ROOTCAS
          value: "[/var/hyperledger/orderer/tls/ca.crt]"
        - name: ORDERER_CHANNELPARTICIPATION_ENABLED
          value: "true"
        - name: ORDERER_ADMIN_LISTENADDRESS
          value: "0.0.0.0:7053"
        - name: ORDERER_ADMIN_TLS_ENABLED
          value: "true"
        - name: ORDERER_ADMIN_TLS_CERTIFICATE
          value: /var/hyperledger/orderer/tls/server.crt
        - name: ORDERER_ADMIN_TLS_PRIVATEKEY
          value: /var/hyperledger/orderer/tls/server.key
        - name: ORDERER_ADMIN_TLS_ROOTCAS
          value: "[/var/hyperledger/orderer/tls/ca.crt]"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
        volumeMounts:
        - name: orderer-storage
          mountPath: /var/hyperledger/production
        - name: orderer-config
          mountPath: /etc/hyperledger/fabric/orderer.yaml
          subPath: orderer.yaml
        - name: crypto
          mountPath: /var/hyperledger/orderer/msp/signcerts/cert.pem
          subPath: msp-cert.pem
        - name: crypto
          mountPath: /var/hyperledger/orderer/msp/keystore/priv_sk
          subPath: msp-key.pem
        - name: crypto
          mountPath: /var/hyperledger/orderer/msp/cacerts/ca.pem
          subPath: msp-ca.pem
        - name: crypto
          mountPath: /var/hyperledger/orderer/msp/admincerts/admin-cert.pem
          subPath: admin-cert.pem
        - name: crypto
          mountPath: /var/hyperledger/orderer/tls/server.crt
          subPath: server.crt
        - name: crypto
          mountPath: /var/hyperledger/orderer/tls/server.key
          subPath: server.key
        - name: crypto
          mountPath: /var/hyperledger/orderer/tls/ca.crt
          subPath: ca.crt
        - name: artifacts
          mountPath: /var/hyperledger/orderer/orderer.genesis.block
          subPath: orderer.genesis.block
        - name: artifacts
          mountPath: /var/hyperledger/orderer/registrar-channel.block
          subPath: registrar-channel.block
        startupProbe:
          httpGet:
            path: /healthz
            port: operations
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /healthz
            port: operations
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: operations
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: orderer-storage
        persistentVolumeClaim:
          claimName: orderer-3-pvc
      - name: orderer-config
        configMap:
          name: fabric-common-config
      - name: crypto
        secret:
          secretName: orderer-3-crypto
      - name: artifacts
        secret:
          secretName: fabric-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: orderer-3
  namespace: plv-annex-campus
spec:
  selector:
    app: orderer-3
  ports:
  - port: 7050
    targetPort: 7050
    name: orderer
  - port: 7051
    targetPort: 7051
    name: cluster
  - port: 7053
    targetPort: 7053
    name: admin
  - port: 9443
    targetPort: 9443
    name: operations
