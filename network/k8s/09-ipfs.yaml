# Stable application endpoint. Nginx retries both reads and non-idempotent API
# requests on another campus when a node is unavailable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipfs-ha-router-config
  namespace: plv-fabric
data:
  default.conf: |-
    upstream ipfs_api_cluster {
      zone ipfs_api_cluster 64k;
      server ipfs-api.plv-fabric.svc.cluster.local:5001 max_fails=1 fail_timeout=5s;
      server ipfs-annex-api.plv-annex-campus.svc.cluster.local:5001 max_fails=1 fail_timeout=5s;
      server ipfs-pubad-api.plv-pubad-campus.svc.cluster.local:5001 max_fails=1 fail_timeout=5s;
    }
    upstream ipfs_gateway_cluster {
      zone ipfs_gateway_cluster 64k;
      server ipfs-gateway.plv-fabric.svc.cluster.local:8080 max_fails=1 fail_timeout=5s;
      server ipfs-annex-gateway.plv-annex-campus.svc.cluster.local:8080 max_fails=1 fail_timeout=5s;
      server ipfs-pubad-gateway.plv-pubad-campus.svc.cluster.local:8080 max_fails=1 fail_timeout=5s;
    }
    server {
      listen 5001;
      client_max_body_size 100m;
      location = /router-health { return 200 "ok\n"; }
      location / {
        proxy_pass http://ipfs_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:5001;
        proxy_set_header Origin "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
      }
    }
    server {
      listen 8080;
      location = /router-health { return 200 "ok\n"; }
      location / {
        proxy_pass http://ipfs_gateway_cluster;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_404 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs-ha-router
  namespace: plv-fabric
spec:
  replicas: 1
  selector:
    matchLabels: { app: ipfs-ha-router }
  template:
    metadata:
      labels: { app: ipfs-ha-router }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - { name: api, containerPort: 5001 }
        - { name: gateway, containerPort: 8080 }
        volumeMounts:
        - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
        readinessProbe: { httpGet: { path: /router-health, port: 5001 }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /router-health, port: 5001 }, initialDelaySeconds: 10, periodSeconds: 15 }
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }
      volumes:
      - { name: config, configMap: { name: ipfs-ha-router-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-ha-api
  namespace: plv-fabric
spec:
  selector: { app: ipfs-ha-router }
  ports:
  - { name: api, port: 5001, targetPort: 5001 }
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-ha-gateway
  namespace: plv-fabric
spec:
  selector: { app: ipfs-ha-router }
  ports:
  - { name: gateway, port: 8080, targetPort: 8080 }
